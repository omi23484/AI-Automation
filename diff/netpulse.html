function anomalyWhy(an){
  if(an.type==='Traffic spike'){
    const exp=an.exp!=null?pct1(an.exp):'its usual level';
    const jump=an.jump!=null?`+${(an.jump*100).toFixed(0)}pp`:'a large step';
    return `Utilization hit <b>${pct1(an.util)}</b> here, but the typical load for this same <b>weekday &amp; hour</b> is only about <b>${exp}</b> (from this link’s own history). That’s ${jump}${an.z!=null?`, <b>${an.z.toFixed(1)}σ</b> above its normal spread`:''} — past the ≥3.2σ and ≥8&nbsp;pp bar the detector requires, so it reads as an unusual spike, not just the normal busy period.`;
  }
  if(an.type==='Weekend traffic on business link'){
    return `Weekend load runs about <b>${pct1(an.util)}</b> (median) on a link that should be quiet on weekends${an.exp!=null?` — vs a weekday median of ~${pct1(an.exp)}`:''}. Unusual for a business link: confirm an intended backup/replication job, or reclassify the link.`;
  }
  if(an.type==='RX/TX imbalance'){
    return `Receive and transmit are persistently lopsided — the busier direction is about <b>${an.ratio!=null?an.ratio.toFixed(1)+'×':'several ×'}</b> the quieter one (median across samples that have both directions, &gt; 6×). Typical of asymmetric routing, one-way flows, or a SPAN/mirror port.`;

  return `Flagged against this link’s own baseline.`;
}

function fcell(l,v,lo,hi){const fmt=x=>x!=null&&x>0&&x<3650?Math.round(x)+'d':(x!=null&&x<=0?'now':'—');

  return `<div class="kpi"><div class="l">${l}</div><div class="v mono" style="font-size:20px">${fmt(v)}</div>${rng}</div>`;}
function distExplain(r){
  const warm=r.dist.warning+r.dist.high;const parts=[];
  if(r.dist.critical>0.02)parts.push(`This link was critically busy ${pct1(r.dist.critical)} of the time (plus ${pct1(r.dist.high)} in the high band).`);
  else if(warm>0.15)parts.push(`This link runs warm ${pct1(warm)} of the time but is rarely critical.`);
  else parts.push(`This link is healthy — in the normal band ${pct1(r.dist.normal)} of the time.`);
  parts.push(`It is busiest ${peakWindow(r)}.`);
  if(r.forecast.growthMoM>0.05)parts.push(`Load is growing ~${(r.forecast.growthMoM*100).toFixed(0)}% per month — watch the forecast below.`);
  return parts.join(' ');
}
function peakWindow(r){let best=null,bv=-1;for(const k in r.heat){if(r.heat[k]>bv){bv=r.heat[k];best=k;}}if(!best)return'across the week';const[d,h]=best.split('-');return `around ${h}:00 on ${DOW[+d]}`;}
function buildTimeline(r){
  const ev=[];
  ev.push({ts:r.start,k:'',txt:'📈 Monitoring began — first sample ingested'});
  for(const an of r.anomalies.slice(0,4))ev.push({ts:an.ts,k:'warning',txt:`⚠ Anomaly: ${an.type}`});
  const t=r.th||th(r.cls);const firstBreach=r.samples.find(x=>x.util>=t.crit);
  if(firstBreach)ev.push({ts:firstBreach.ts,k:'critical',txt:`🔴 First Critical breach (${pct1(firstBreach.util)})`});
  for(const m of S.maintenance.filter(m=>m.target===r.ifid||m.target===r.dev||m.scope==='all'))ev.push({ts:m.start,k:'maint',txt:`⚙ Maintenance: ${esc(m.reason||'window')}`});
  for(const c of (S.comments[r.ifid]||[]))ev.push({ts:c.ts,k:'',txt:`💬 ${esc(c.who)}: ${esc(c.txt)}`});
  return ev.sort((a,b)=>b.ts-a.ts);
}

// Export the processed samples for a date range so the data can be audited end-to-end

function exportProcessed(fmt){
  if(!S.samples.length){toast('No data yet');return;}
  const scope=($('#pdScope')||{}).value||'all';
  const from=($('#pdFrom')||{}).value?new Date($('#pdFrom').value).getTime():-Infinity;
  const to=($('#pdTo')||{}).value?new Date($('#pdTo').value).getTime():Infinity;
  const ur=S.cfg.upgradeRule,thr=ur.utilPct/100,flag=S.cfg.flagUtilAbove||1.0;
  const p2=n=>String(n).padStart(2,'0');
  // seconds included so the audit reconciles to the exact source timestamp (e.g. 00:00:46)
  const fmtTs=ts=>{const d=new Date(ts);return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())} ${tzLabel()}`;};
  const sel=S.samples.filter(x=>x.ts>=from&&x.ts<=to&&(scope==='all'||x.ifid===scope));
  if(!sel.length){toast('No samples in that range/link');return;}
  sel.sort((a,b)=>a.ifid<b.ifid?-1:a.ifid>b.ifid?1:a.ts-b.ts);
  const MAX=fmt==='xlsx'?200000:1000000;let trunc=false;
  const use=sel.length>MAX?(trunc=true,sel.slice(0,MAX)):sel;
  const CFS=cfList();
  // per-link custom-field values, resolved once (override wins over file value)
  const cfByIf={};for(const rr of A().ifs){const o={};for(const c of CFS)o[c.key]=cfVal(rr,c.key);cfByIf[rr.ifid]=o;}
  const hdr=['Device','Interface',...CFS.map(c=>c.label),'Timestamp (local)','Epoch ms','Transmit (Mbps)','Received (Mbps)','Peak Tx (Mbps)','Peak Rx (Mbps)','Capacity Tx (Mbps)','Capacity Rx (Mbps)','Transmit %','Receive %','Utilization % (max)','Peak %','Period','Policy threshold %','Counts as policy hit','Capacity review'];
  const rows=[hdr];
  for(const x of use){
    const bad=!!x.bad,bh=isBH(x.ts);
    const txp=(x.tx!=null&&x.speedTx)?x.tx/x.speedTx:null;
    const rxp=(x.rx!=null&&x.speedRx)?x.rx/x.speedRx:null;
    const hit=!bad&&x.util!=null&&x.util>=thr&&(!ur.businessHoursOnly||bh);
    rows.push([x.dev,x.intf,...CFS.map(c=>(cfByIf[x.ifid]||{})[c.key]||''),fmtTs(x.ts),x.ts,
      x.tx!=null?+(x.tx/1e6).toFixed(3):'',x.rx!=null?+(x.rx/1e6).toFixed(3):'',
      x.ptx!=null?+(x.ptx/1e6).toFixed(3):'',x.prx!=null?+(x.prx/1e6).toFixed(3):'',
      x.speedTx?+(x.speedTx/1e6).toFixed(0):'',x.speedRx?+(x.speedRx/1e6).toFixed(0):'',
      txp!=null?+(txp*100).toFixed(2):'',rxp!=null?+(rxp*100).toFixed(2):'',
      x.util!=null?+(x.util*100).toFixed(2):'',x.pu!=null?+(x.pu*100).toFixed(2):'',
      bh?'Market hours':'Non-market hours',ur.utilPct,bad?'invalid (negative)':(hit?'Yes':'No'),
      (x.util!=null&&x.util>flag)?`⚠ over ${Math.round(flag*100)}% — verify capacity (kept, not dropped)`:'']);
  }
  if(trunc)rows.push([`NOTE: truncated at ${MAX.toLocaleString()} rows — narrow the date range or pick a single link for the full slice.`]);
  const stamp=new Date().toISOString().slice(0,10),scopeLbl=scope==='all'?'AllLinks':scope.replace(/\W+/g,'_');
  if(fmt==='csv'){
    const csv=rows.map(r=>r.map(c=>{const s=String(c==null?'':c);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\n');
    dl(new Blob([csv],{type:'text/csv;charset=utf-8'}),`NetPulse_ProcessedData_${scopeLbl}_${stamp}.csv`);
  }else{
    dl(xlsxBlob([{name:'Processed Data',rows}]),`NetPulse_ProcessedData_${scopeLbl}_${stamp}.xlsx`);
  }
  logAudit('data.export.processed',scope,`${use.length} rows${trunc?' (truncated)':''}`);
  toast(`⬇ ${use.length.toLocaleString()} processed sample(s) exported${trunc?' — truncated, narrow the range':''}`);
}

function upgradeHits(r,winStart,winEnd){
  const ur=r.upgradeRule;const thr=ur.utilPct/100;
  let hits=0,last=null,peak=0;const days=new Set();
  for(const x of r.samples){
    if(x.ts<winStart||x.ts>winEnd)continue;
    if(x.util==null||x.util<thr)continue;
    if(ur.businessHoursOnly&&!isBH(x.ts))continue;
    hits++;days.add(new Date(x.ts).toDateString());last=x.ts;if(x.util>peak)peak=x.util;
  }
  return {hits,days:days.size,last,peak,thr:ur.utilPct,bhOnly:ur.businessHoursOnly,reqDays:ur.days,met:days.size>=ur.days};
}
// Per-month breakdown of samples + policy hits for one link, gap-filled so months
// with NO data show as an empty stub. Lets you see, month by month, whether the
// recent months actually carry data and any threshold crossings for this link.
function monthlyPolicy(r){
  const ur=r.upgradeRule,thr=ur.utilPct/100,m={};
  const ymOf=d=>d.getFullYear()*12+d.getMonth();
  const keyOf=ym=>Math.floor(ym/12)+'-'+String(ym%12+1).padStart(2,'0');
  for(const x of r.samples){
    if(x.util==null)continue;
    const d=new Date(x.ts),ym=ymOf(d),key=keyOf(ym);
    let o=m[key];if(!o)o=m[key]={ym,key,samples:0,hits:0,days:new Set(),peak:0};
    o.samples++;
    if(x.util<thr)continue;
    if(ur.businessHoursOnly&&!isBH(x.ts))continue;
    o.hits++;o.days.add(d.getDate());if(x.util>o.peak)o.peak=x.util;
  }
  const keys=Object.keys(m);if(!keys.length)return [];
  const lo=Math.min(...keys.map(k=>m[k].ym)),hi=Math.max(...keys.map(k=>m[k].ym));
  const out=[];
  for(let ym=lo;ym<=hi;ym++){const o=m[keyOf(ym)];out.push(o?{key:o.key,samples:o.samples,hits:o.hits,days:o.days.size,peak:o.peak}:{key:keyOf(ym),samples:0,hits:0,days:0,peak:0});}
  return out;
}

function view_reports(){
  const reports=[['exec','Executive Summary'],['capacity','Weekly Capacity Report'],['trend','Monthly Trend Report'],['busy','Top Busy Links'],['critical','Top Critical Links'],['idle','Idle Links'],['impact','Business Impact Report']];
  // Rank the scope pickers by relevance — links that meet the upgrade trigger first,
  // then busiest by p95 — so the link you actually want to report on is at the top and
  // clearly flagged, instead of hidden alphabetically among quiet links.
  const links=S.samples.length?[...A().ifs].sort((x,y)=>(y.upgradeNeeded-x.upgradeNeeded)||(y.p95-x.p95)||x.dev.localeCompare(y.dev)||x.intf.localeCompare(y.intf)):[];
  // Sample count is included so a tiny hostname-variant fragment (e.g. a link that also
  // appears under its FQDN) is obviously a stub next to the real interface with thousands.
  const scopeLabel=r=>`${esc(r.dev)} ${esc(r.intf)}${r.linkname?' · '+esc(r.linkname):''} · ${r.count.toLocaleString()} samples · p95 ${(r.p95*100).toFixed(0)}%${r.upgradeNeeded?' · ⚠ upgrade':''}`;
  const ur=S.cfg.upgradeRule;
  return crumb([['Reports']])+`<div class="sec-title"><h2>Business Reports</h2><span class="sub">generated · grounded · exportable</span></div>
  <div class="panel pad" style="margin-bottom:16px;border:1px solid var(--stroke2)">
    <div class="sec-title"><h2>📋 Regulatory Capacity Report</h2><span class="sub">formal, sign-off-ready capacity utilization &amp; augmentation report vs your regulatory threshold${S.cfg.institution?' · '+esc(S.cfg.institution):''}</span></div>
    <div class="flex" style="gap:12px">
      <label class="fld" style="margin:0;min-width:340px"><span>Scope</span><select id="regScope" style="width:100%" ${links.length?'':'disabled'}><option value="all">All links (${links.length})</option>${links.map(r=>`<option value="${esc(r.ifid)}">${scopeLabel(r)}</option>`).join('')}</select></label>
      <button class="btn" style="margin-top:16px" ${links.length?'':'disabled'} onclick="genRegReport($('#regScope').value,'xlsx')">⤓ Excel</button>
      <button class="btn ghost" style="margin-top:16px" ${links.length?'':'disabled'} onclick="genRegReport($('#regScope').value,'pdf')">🖨 PDF</button>
      <button class="btn ghost" style="margin-top:16px" ${links.length?'':'disabled'} onclick="genRegReport($('#regScope').value,'html')">HTML</button>
      <span class="mini" style="margin-top:16px">threshold ${(S.cfg.regThreshold*100).toFixed(0)}% (p95 basis) · market hours · data-integrity &amp; sign-off — set details in Admin → Compliance</span>
    </div>
  </div>
  <div class="panel pad" style="margin-bottom:16px">
    <div class="sec-title"><h2>📊 Upgrade Policy Hits — Excel report</h2><span class="sub">customer-facing .xlsx: every timestamp the upgrade threshold was crossed, with the utilization at that moment</span></div>
    <div class="flex" style="gap:12px">
      <label class="fld" style="margin:0;min-width:340px"><span>Scope</span><select id="upXlsxScope" style="width:100%" ${links.length?'':'disabled'}>
        <option value="all">All links (${links.length})</option>
        ${links.map(r=>`<option value="${esc(r.ifid)}">${scopeLabel(r)}</option>`).join('')}
      </select></label>
      <button class="btn" style="margin-top:16px" ${links.length?'':'disabled'} onclick="genUpgradePolicyXlsx($('#upXlsxScope').value)">⤓ Generate .xlsx</button>
      <span class="mini" style="margin-top:16px">policy: util &gt; ${ur.utilPct}%${ur.businessHoursOnly?' in business hours':''} for ${ur.days} day(s) — edit in Admin → Link upgrade policy · two sheets: Summary + Policy Hits</span>
    </div>
  </div>
  <div class="grid g3">${reports.map(([k,l])=>`<div class="panel pad"><div class="sec-title"><h2 style="font-size:14px">${l}</h2></div><div class="flex"><button class="btn sm" onclick="genReport('${k}')">Generate</button></div></div>`).join('')}</div>

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

function zipStore(files){ // [{name,text}] → Blob (ZIP, method 0)

    const name=enc.encode(f.name),data=enc.encode(f.text),crc=crc32(data);

    lh.setUint16(10,dosTime,true);lh.setUint16(12,dosDate,true);lh.setUint32(14,crc,true);
    lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,name.length,true);

    ch.setUint16(12,dosTime,true);ch.setUint16(14,dosDate,true);ch.setUint32(16,c.crc,true);
    ch.setUint32(20,c.size,true);ch.setUint32(24,c.size,true);ch.setUint16(28,c.name.length,true);

}
const xmlEsc=v=>String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function colL(i){let t='';i++;while(i>0){t=String.fromCharCode(64+((i-1)%26+1))+t;i=Math.floor((i-1)/26);}return t;}
function sheetXML(rows){
  let out='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  rows.forEach((row,ri)=>{out+=`<row r="${ri+1}">`;
    row.forEach((v,ci)=>{if(v==null||v==='')return;const ref=colL(ci)+(ri+1);
      if(typeof v==='number'&&isFinite(v))out+=`<c r="${ref}"><v>${v}</v></c>`;
      else out+=`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;});
    out+='</row>';});

}
function xlsxBlob(sheets){ // [{name,rows:[[...]]}] → .xlsx Blob

    {name:'_rels/.rels',text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml',text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map((sh,i)=>`<sheet name="${xmlEsc(sh.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+'</sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels',text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')+'</Relationships>'}

/* ---- Upgrade Policy Hits report (.xlsx): per link or all links, every timestamp

function genUpgradePolicyXlsx(scope){
  if(!S.samples.length){toast('No data yet');return;}
  const a=A();const list=scope==='all'?a.ifs:a.ifs.filter(r=>r.ifid===scope);
  if(!list.length){toast('Link not found');return;}
  // Single-link export: if the SAME interface exists under a device-name variant
  // (one hostname is a dotted prefix of the other — short name vs FQDN) that holds far
  // more data, the user probably picked a fragment. Flag the busier twin in the report.
  let siblingNote=null;

    const twin=a.ifs.filter(x=>x.ifid!==r0.ifid&&x.intf===r0.intf&&(x.dev.startsWith(r0.dev+'.')||r0.dev.startsWith(x.dev+'.'))&&x.count>Math.max(8,r0.count*2))
      .sort((x,y)=>y.count-x.count)[0];
    if(twin)siblingNote=`⚠ Likely wrong link selected. The same interface exists under a device-name variant “${twin.dev} ${twin.intf}” with ${twin.count.toLocaleString()} samples (p95 ${(twin.p95*100).toFixed(0)}%, ${twin.upgradeNeeded?'upgrade trigger MET':'no upgrade'}) — this export is the smaller “${r0.dev} ${r0.intf}” (${r0.count.toLocaleString()} samples). Re-export with the larger one selected, or use “All links”.`;
  }
  const p2=n=>String(n).padStart(2,'0');
  const CFS=cfList();
  const fmtTs=ts=>{const d=new Date(ts);return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())} ${tzLabel()}`;};
  const cStart=amin(list.map(r=>r.start)),cEnd=amax(list.map(r=>r.end));
  const covDays=Math.max(1,Math.round(days(cStart,cEnd)));
  // The report is the complete evidence log over ALL loaded history, so the summary
  // counts (days hit, total hits, trigger met) are computed over exactly the same set of
  // rows as the Policy Hits detail — the two sheets always agree. (The on-screen verdict
  // instead uses the rolling look-back window from Admin → Link upgrade policy.)
  const summary=[
    ['NetPulse — Link Upgrade Policy Report'],
    [`Generated: ${fmtIST(Date.now())}`,'',`Scope: ${scope==='all'?'all links':list[0].dev+' '+list[0].intf}`],
    [`Coverage: ${fmtIST(cStart)}  to  ${fmtIST(cEnd)}  (${covDays} days, entire loaded history)`],
    ['Counts below cover the full loaded history; the live "Upgrade Recommended" verdict uses the rolling '+(S.cfg.upgradeRule.lookbackDays?S.cfg.upgradeRule.lookbackDays+'-day':'full-history')+' look-back window.'],
    ['NOTE: Every threshold crossing is listed and tagged Market hours vs Non-market hours. '+(list.some(r=>r.upgradeRule.businessHoursOnly)?'Policy = "Market hours only": only Market-hr hits count toward the upgrade trigger (Days threshold hit / Upgrade trigger met); Non-market-hr hits (e.g. overnight/backup peaks) are shown for visibility but do NOT trigger. Change it in Admin → Link upgrade policy.':'Policy = "All hours": both Market-hr and Non-market-hr hits count toward the trigger.')],
    ...(list.some(r=>r.capChange)?[['NOTE: '+list.filter(r=>r.capChange).map(r=>`${r.dev} ${r.intf} capacity changed ${r.capChange.distinct.map(v=>(v/1e6).toFixed(0)+' Mbps').join('→')}`).join('; ')+'. Utilization is measured per-sample against the capacity in force at that time; the "Capacity (Mbps)" column shows the latest.']]:[]),
    ...(siblingNote?[[siblingNote]]:[]),
    [],
    ['Device','Interface','Link name','Site',...CFS.map(c=>c.label),'Class','Impact','Capacity (Mbps)','Policy threshold %','Policy days','Policy counts','Days threshold hit','Market-hr hits','Non-market-hr hits','Total crossings','Last hit','Data through','Upgrade trigger met','Busy p95 %','Verdict']];
  // Detail log lists EVERY crossing of the threshold, tagged Market vs Non-market hours,
  // so overnight/backup peaks are visible even when the policy only counts market hours.
  const hits=[['Device','Interface','Site',...CFS.map(c=>c.label),'Timestamp','Period','Utilization %','Transmit (Mbps)','Received (Mbps)','Capacity (Mbps)','Counts toward policy','Policy threshold %']];
  // Per-day roll-up: one row per day, market-hour and non-market-hour hits split out.
  const perday=[['Device','Interface','Site',...CFS.map(c=>c.label),'Date','Day of week','Market-hr hits','Non-market-hr hits','Total hits','Peak util %','First hit','Last hit','Policy threshold %']];
  const hm=ts=>{const d=new Date(ts);return `${p2(d.getHours())}:${p2(d.getMinutes())}`;};

    totalHits+=allCross.length;
    // "Last hit" vs "Data through" sit side by side so a link whose crossings stopped

    summary.push([r.dev,r.intf,r.linkname||'',r.site,...CFS.map(c=>cfVal(r,c.key)),r.cls,r.impact,r.speed?+(r.speed/1e6).toFixed(0):'',ur.utilPct,ur.days,ur.businessHoursOnly?'Market hours only':'All hours',daysHit,mkt.length,nonMkt.length,allCross.length,lastHitTs?fmtTs(lastHitTs):'—',fmtTs(r.end),met?'YES':'no',+(r.p95*100).toFixed(1),r.verdict.title]);

    }

    const byDay=new Map();
    for(const x of allCross){const d=new Date(x.ts);const key=`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
      let o=byDay.get(key);if(!o){o={key,dow:DOW[d.getDay()],mkt:0,non:0,peak:0,first:x.ts,last:x.ts};byDay.set(key,o);}

    for(const o of [...byDay.values()].sort((p,q)=>p.key.localeCompare(q.key)))

  }

function exportLink(id,fmt){
  const r=A().ifs.find(x=>x.ifid===id);if(!r)return;

  logAudit('link.export',id,fmt.toUpperCase());
  if(fmt==='html'){dl(new Blob([html],{type:'text/html'}),base+'_netpulse.html');toast('HTML report downloaded');}
  else{const w=window.open('','_blank');if(!w){toast('Allow pop-ups to export PDF');return;}w.document.write(html);w.document.close();
    w.onload=()=>{setTimeout(()=>{w.focus();w.print();},250);};toast('Opening print dialog — choose “Save as PDF”');}
}
/* ---- Threshold Breach Report (submission-grade PDF via print) ------------------

   above the Warning and Critical thresholds, filterable to market / non-market / all

function genBreachReport(id,hours,bands){
  const r=A().ifs.find(x=>x.ifid===id);if(!r){toast('Link not found');return;}
  const html=breachReportHTML(r,hours||'all',bands||'warn');
  const w=window.open('','_blank');if(!w){toast('Allow pop-ups to export the PDF');return;}
  w.document.write(html);w.document.close();
  w.onload=()=>{setTimeout(()=>{w.focus();w.print();},350);};
  logAudit('link.breachreport',id,'hours='+(hours||'all')+' bands='+(bands||'warn'));
  toast('Opening print dialog — choose “Save as PDF”');
}
function breachReportHTML(r,hours,bands){
  const DAY=86400000, winDays=183;                       // last 6 months

  const covDays=Math.max(1,Math.round((winEnd-winStart)/DAY));

  // Which severity bands to include. "Warning and above" can run to thousands of rows on a

  const lowThr={warn:r.th.warn,high:r.th.high,crit:r.th.crit}[bands];
  const hourOk=x=>hours==='bh'?isBH(x.ts):hours==='off'?!isBH(x.ts):true;
  const thFor=x=>isBH(x.ts)?r.th:(r.thOff||r.th);
  const p2=n=>String(n).padStart(2,'0');
  const fmtT=ts=>{const d=new Date(ts);return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;};
  const fmtD=ts=>{const d=new Date(ts);return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;};
  const hm=ts=>{const d=new Date(ts);return `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;};

  const breaches=[]; let cW=0,cH=0,cC=0; const dW=new Set(),dC=new Set(); let peak=0,peakTs=null; const byDay={};
  let mWarn=0,mCrit=0,nWarn=0,nCrit=0;   // market vs non-market splits (warning-plus / critical)

function genDemo(){
  const sites=['LON','NYC'];const devs=['Core-01','Core-02','Edge-01','Leaf-11','Leaf-12','Agg-01'];
  const intfs=[['Ethernet1/1','Core'],['Ethernet1/2','Trading'],['Ethernet1/3','Internet'],['Po10','Core'],['Ethernet2/1','Backup'],['Ethernet2/2','Storage'],['Ethernet2/3','Customer'],['mgmt0','Management']];
  const speeds={Core:1e11,Trading:1e10,Internet:1e10,Backup:1e10,Storage:4e10,Customer:1e10,Management:1e9};
  const now=Date.now();const start=now-14*86400000;const rows=[];
  let seed=42;const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  for(let si=0;si<sites.length;si++)for(let di=0;di<3;di++){const dev=sites[si]+'-'+devs[di+si*3%devs.length];
    for(const [intf,cls] of intfs){const speed=speeds[cls];const base=({Trading:.35,Core:.4,Internet:.5,Backup:.15,Storage:.3,Customer:.45,Management:.05})[cls]||.3;
      const growth=(cls==='Trading'||cls==='Internet'||cls==='Customer')?(0.35+rnd()*0.5):(rnd()*0.12);
      for(let t=start;t<now;t+=3600000){const d=new Date(t);const hr=d.getHours(),dow=d.getDay();const prog=(t-start)/(now-start);
        let u=base*(1+growth*prog);
        if(dow>=1&&dow<=5&&hr>=9&&hr<17)u*=1.35+ (cls==='Trading'?0.35:0);
        else u*=0.5;
        if((dow===0||dow===6)&&cls==='Backup')u=0.8+rnd()*0.15;
        if((dow===0)&&cls==='Core'&&rnd()>0.75)u+=0.28; // injected weekend anomaly
        u=Math.max(0.01,u+ (rnd()-0.5)*0.10);
        const util=Math.min(u,0.99);const bps=util*speed;const rx=bps*(0.55+rnd()*0.45);
        const pkT=Math.min(bps*(1.15+rnd()*0.6),speed*0.995),pkR=Math.min(rx*(1.15+rnd()*0.6),speed*0.995);
        rows.push([dev,intf,new Date(t).toISOString().slice(0,19).replace('T',' '),
          (bps/1e9).toFixed(3),(rx/1e9).toFixed(3),(pkT/1e9).toFixed(3),(pkR/1e9).toFixed(3),(speed/1e9)+'G',(speed/1e9)+'G']);
      }}}
  const headers=['Device','Port','Poll Timestamp','Average Transmit (Gbps)','Average Receive (Gbps)','Peak Transmit (Gbps)','Peak Receive (Gbps)','Transmit Bandwidth','Received Bandwidth'];
  const resolved=resolveColumns(headers,rows);
  const built=buildSamples(rows,resolved,'demo_polling_14d.xlsx','staged');
  const batchId='b'+Date.now();built.samples.forEach(x=>x.batch=batchId);
  S.samples=S.samples.concat(built.samples);
  S.batches.unshift({id:batchId,file:'demo_polling_14d.xlsx',ts:Date.now(),who:S.role,rows:rows.length,added:built.samples.length,coverage:[start,now],checksum:'demo',src:'demo',intervalNote:'~60 min',entities:new Set(built.samples.map(x=>x.ifid)).size,map:resolved.map,headers});
  IDB.put('spl:'+batchId,built.samples);save('batches');logAudit('demo.generate','',built.samples.length+' samples');
  S.analytics=null;toast('✨ Demo data generated — '+built.samples.length.toLocaleString()+' samples');go('exec');
}

function tipFor(txt){const t=(txt||'').toLowerCase().replace(/\s+/g,' ').trim();for(const [k,v] of GLOSSARY)if(t.includes(k))return v;return null;}
function annotateInfo(){
  $$('#main th, #main .kpi .l, #main .sec-title h2, #main .dist-legend .row > span').forEach(el=>{
    if(el.querySelector('.info')||el.dataset.noinfo!=null)return;
    const tip=tipFor(el.textContent);
    if(tip){const s=document.createElement('span');s.className='info';s.textContent='i';s.setAttribute('data-tip',tip);el.appendChild(s);}
  });
}
let GTIP;
document.addEventListener('mouseover',e=>{
  const t=e.target.closest&&e.target.closest('[data-tip]');if(!t)return;
  if(!GTIP){GTIP=document.createElement('div');GTIP.id='gtip';document.body.appendChild(GTIP);}
  GTIP.textContent=t.getAttribute('data-tip');GTIP.style.display='block';
  const r=t.getBoundingClientRect();
  let left=Math.min(window.innerWidth-GTIP.offsetWidth-8,Math.max(8,r.left));
  let top=r.bottom+8;
  if(top+GTIP.offsetHeight>window.innerHeight-8)top=r.top-GTIP.offsetHeight-8;
  GTIP.style.left=left+'px';GTIP.style.top=Math.max(8,top)+'px';
});
document.addEventListener('mouseout',e=>{if(GTIP&&e.target.closest&&e.target.closest('[data-tip]'))GTIP.style.display='none';});
function render(){
  renderNav();
  for(const k in CHARTS)delete CHARTS[k];
  const main=$('#main');const fn=VIEWS[S.view]||view_exec;
  try{main.innerHTML=fn();}catch(e){main.innerHTML=`<div class="empty"><div class="big">⚠</div><h2>Render error</h2><p class="small">${esc(e.message)}</p></div>`;console.error(e);}
  main.classList.remove('swap');void main.offsetWidth;main.classList.add('swap');
  staggerReveal();animateCounters();annotateInfo();
  wireDynamic();
}
function wireDynamic(){
  const dz=$('#dz');
  if(dz){const inp=$('#fileInput');window.fileInput=inp;
    inp.onchange=e=>{const fs=[...e.target.files];e.target.value='';handleFiles(fs);};
    ['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag');}));
    ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag');}));
    dz.addEventListener('drop',e=>handleFiles(e.dataTransfer.files));
  }
}

/* ------------------------------- events ----------------------------------- */
document.addEventListener('click',e=>{
  const hc=e.target.closest('.heat .cell[data-info]');
  if(hc){const wrap=hc.closest('.heatwrap');
    if(wrap){wrap.querySelectorAll('.selcell').forEach(x=>x.classList.remove('selcell'));hc.classList.add('selcell');
      const tip=wrap.querySelector('.heattip');if(tip){tip.textContent=hc.dataset.info;tip.style.display='block';}}
    return;}
  const cz=e.target.closest('[data-cz]');
  if(cz){const cfg=chartAt(e);if(cfg){const mid=(cfg.vx0+cfg.vx1)/2;
    if(cz.dataset.cz==='in')chartZoom(cfg,mid,0.6);
    else if(cz.dataset.cz==='out')chartZoom(cfg,mid,1.7);
    else{cfg.vx0=cfg.fx0;cfg.vx1=cfg.fx1;redrawChart(cfg);}}return;}
  const nav=e.target.closest('[data-view]');if(nav){go(nav.dataset.view);return;}
  const n=e.target.closest('[data-nav]');if(n){navTo(JSON.parse(n.dataset.nav));return;}
  const tw=e.target.closest('[data-twin]');if(tw){navTo({twin:JSON.parse(tw.dataset.twin)});return;}
});
$('#roleSel').onchange=e=>{S.role=e.target.value;logAudit('role.switch',e.target.value);toast('Viewing as '+e.target.value);};
$('#demoBtn').onclick=genDemo;
$('#wallBtn').onclick=()=>{document.documentElement.requestFullscreen?.();};
function applyTheme(t){document.documentElement.classList.toggle('light',t==='light');try{localStorage.setItem('np-theme',t)}catch(e){}}
$('#themeBtn').onclick=()=>{applyTheme(document.documentElement.classList.contains('light')?'dark':'light');render();};
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')handleQuery(e.target.value);});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();$('#q').focus();}});
function handleQuery(q){
  if(!q.trim())return;if(!S.samples.length){toast('No data yet');return;}
  const a=A();const ql=q.toLowerCase();
  // entity match
  let hit=a.ifs.find(r=>ql.includes(r.intf.toLowerCase())&&ql.includes(r.dev.toLowerCase()))||a.ifs.find(r=>ql.includes(r.dev.toLowerCase()))||a.ifs.find(r=>ql.includes(r.intf.toLowerCase()));
  if(hit){navTo({view:'intf',id:hit.ifid});toast('Grounded answer: '+hit.verdict.title+' — '+pct1(hit.p95)+' p95');return;}
  if(/critical|worst|risk/.test(ql)){const r=[...a.ifs].sort((x,y)=>y.risk.score-x.risk.score)[0];navTo({view:'intf',id:r.ifid});toast('Highest-risk link: '+r.dev+' '+r.intf);return;}
  if(/capacity|forecast|upgrade|saturat/.test(ql)){go('capacity');return;}
  if(/anomal/.test(ql)){go('anomalies');return;}
  toast('No entity matched. Try “Core-01 Ethernet1/2” or “worst link”.');
}
