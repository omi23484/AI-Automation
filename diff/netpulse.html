<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetPulse — Network Analytics & Capacity Planning</title>
<style>
:root{
  --bg:#0a0e17; --bg2:#0d1320; --panel:rgba(20,28,44,0.66); --panel2:rgba(28,38,58,0.55);
  --stroke:rgba(120,150,200,0.14); --stroke2:rgba(120,150,200,0.28);
  --txt:#e6edf7; --muted:#8ea0bd; --muted2:#61718f;
  --accent:#38bdf8; --accent2:#818cf8;
  --normal:#2dd4bf; --warning:#fbbf24; --high:#fb923c; --critical:#f43f5e;
  --down:#64748b; --nodata:#334155;
  --crit-glow:rgba(244,63,94,0.5); --shadow:0 10px 40px rgba(0,0,0,0.45);
  --r:14px;
  --chrome:rgba(10,14,23,.5); --thbg:rgba(13,19,32,.9);
  --gridline:rgba(120,150,200,.09); --ai-txt:#d7e2f2;
  --panelfr:linear-gradient(180deg,#0c1220,#0a0f1a); --port:#0f1626;
  --pagebg:
    radial-gradient(1200px 700px at 82% -8%, rgba(56,189,248,0.10), transparent 60%),
    radial-gradient(1000px 600px at -6% 12%, rgba(129,140,248,0.10), transparent 55%),
    linear-gradient(180deg,#0a0e17,#080b12);
}
:root{--anomtxt:#fdba74;--errtxt:#fca5a5;}
:root.light{
  --anomtxt:#b45309; --errtxt:#be123c;
  --bg:#eef2f8; --bg2:#ffffff; --panel:rgba(255,255,255,0.75); --panel2:rgba(21,58,111,0.06);
  --stroke:rgba(24,54,102,0.13); --stroke2:rgba(24,54,102,0.25);
  --txt:#152238; --muted:#44546e; --muted2:#7285a0;
  --accent:#0284c7; --accent2:#6366f1;
  --normal:#0d9488; --warning:#b45309; --high:#c2410c; --critical:#e11d48;
  --down:#64748b; --nodata:#cbd5e1;
  --crit-glow:rgba(225,29,72,0.30); --shadow:0 10px 30px rgba(23,43,77,0.10);
  --chrome:rgba(255,255,255,.65); --thbg:rgba(244,247,251,.94);
  --gridline:rgba(24,54,102,.08); --ai-txt:#22324b;
  --panelfr:linear-gradient(180deg,#e7ecf4,#dde4ef); --port:#f2f5fa;
  --pagebg:
    radial-gradient(1200px 700px at 82% -8%, rgba(2,132,199,0.08), transparent 60%),
    radial-gradient(1000px 600px at -6% 12%, rgba(99,102,241,0.07), transparent 55%),
    linear-gradient(180deg,#eef2f8,#e6ebf4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--pagebg);
  color:var(--txt);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s;
}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:.2px}
a{color:var(--accent);text-decoration:none}
button{font:inherit;cursor:pointer;color:var(--txt)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(120,150,200,.22);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* Layout */
#app{display:grid;grid-template-columns:236px 1fr;grid-template-rows:56px 1fr;height:100vh;grid-template-areas:"logo top" "nav main"}
#topbar{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--stroke);background:var(--chrome);backdrop-filter:blur(10px)}
#brand{grid-area:logo;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--stroke);border-right:1px solid var(--stroke);background:var(--chrome)}
#brand .dot{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#7ee7ff,#38bdf8);box-shadow:0 0 14px var(--accent)}
#brand b{font-size:16px;letter-spacing:.4px}
#nav{grid-area:nav;overflow:auto;border-right:1px solid var(--stroke);padding:12px 10px;background:var(--chrome)}
#main{grid-area:main;overflow:auto;padding:22px 26px 60px}
.navgrp{color:var(--muted2);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;margin:14px 10px 6px;font-weight:700}
.navitem{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:10px;color:var(--muted);cursor:pointer;font-weight:550;font-size:13px;transition:.15s}
.navitem:hover{background:var(--panel2);color:var(--txt)}
.navitem.active{background:linear-gradient(90deg,rgba(56,189,248,.16),rgba(129,140,248,.10));color:var(--txt);box-shadow:inset 0 0 0 1px var(--stroke2)}
.navitem .ic{width:16px;text-align:center;opacity:.9}
.navitem .badge{margin-left:auto;background:var(--critical);color:#fff;font-size:10px;padding:1px 6px;border-radius:20px;font-weight:700}

/* Topbar */
#search{flex:1;max-width:560px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--stroke);border-radius:10px;padding:7px 12px;color:var(--muted)}
#search input{flex:1;background:none;border:0;outline:0;color:var(--txt);font:inherit}
#search kbd{font:11px/1 ui-monospace,monospace;background:rgba(255,255,255,.06);border:1px solid var(--stroke2);border-radius:5px;padding:3px 5px;color:var(--muted)}
.topbtn{background:var(--panel);border:1px solid var(--stroke);border-radius:9px;padding:7px 11px;color:var(--muted);font-weight:600}
.topbtn:hover{color:var(--txt);border-color:var(--stroke2)}
.role{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--stroke);border-radius:20px;padding:5px 6px 5px 12px;font-size:12.5px}
.role select{background:none;border:0;color:var(--txt);font:inherit;outline:0}

/* Breadcrumb */
.crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-bottom:16px;flex-wrap:wrap}
.crumb a{color:var(--muted)} .crumb a:hover{color:var(--txt)}
.crumb .sep{opacity:.4}
.crumb .here{color:var(--txt);font-weight:600}

/* Cards & panels */
.panel{background:var(--panel);border:1px solid var(--stroke);border-radius:var(--r);backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g-main{grid-template-columns:1fr 340px}
@media(max-width:1150px){.g-main,.g2,.g3,.g4{grid-template-columns:1fr}}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.sec-title h2{font-size:16px}.sec-title .sub{color:var(--muted);font-size:12.5px;font-weight:500}
.kpi{padding:15px 16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--stroke);position:relative;overflow:hidden}
.kpi .l{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.3px}
.kpi .v{font-size:27px;font-weight:720;margin-top:4px;letter-spacing:.5px}
.kpi .t{font-size:11.5px;margin-top:3px;font-weight:600}
.kpi .glow{position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;filter:blur(24px);opacity:.5}
.up{color:#fb7185}.down{color:#34d399}.flat{color:var(--muted)}

/* Verdict banner */
.verdict{border-radius:var(--r);padding:16px 18px;border:1px solid var(--stroke);position:relative;overflow:hidden;background:var(--panel)}
.verdict:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.verdict.normal:before{background:var(--normal)}.verdict.warning:before{background:var(--warning)}
.verdict.high:before{background:var(--high)}.verdict.critical:before{background:var(--critical)}
.verdict .lvl{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:20px}
.verdict h3{font-size:17px;margin:9px 0 6px}
.verdict .reason{color:var(--muted);font-size:13px;max-width:70ch}
.verdict .act{margin-top:10px;font-size:12.5px;color:var(--accent);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;border:1px solid var(--stroke2)}
.pill.normal{color:var(--normal);background:rgba(45,212,191,.1)}.pill.warning{color:var(--warning);background:rgba(251,191,36,.1)}
.pill.high{color:var(--high);background:rgba(251,146,60,.1)}.pill.critical{color:var(--critical);background:rgba(244,63,94,.12)}
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:rgba(120,150,200,.12);color:var(--muted);margin-right:5px}
.chip.impact-Critical{background:rgba(244,63,94,.16);color:#fda4af}
.chip.impact-High{background:rgba(251,146,60,.16);color:#fdba74}
.chip.impact-Medium{background:rgba(251,191,36,.14);color:#fde68a}
.chip.impact-Low{background:rgba(100,116,139,.18);color:#cbd5e1}
:root.light .chip.impact-Critical{background:rgba(225,29,72,.12);color:#be123c}
:root.light .chip.impact-High{background:rgba(194,65,12,.12);color:#c2410c}
:root.light .chip.impact-Medium{background:rgba(180,83,9,.12);color:#92610a}
:root.light .chip.impact-Low{background:rgba(71,85,105,.12);color:#475569}
:root.light .up{color:#e11d48}
:root.light .down{color:#047857}
.conf{color:var(--muted);font-size:11.5px}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted2);font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--stroke);position:sticky;top:0;background:var(--thbg);backdrop-filter:blur(6px)}
td{padding:9px 10px;border-bottom:1px solid rgba(120,150,200,.07)}
tbody tr{cursor:pointer;transition:.12s}
tbody tr:hover{background:var(--panel2)}
.rank{color:var(--muted);font-variant-numeric:tabular-nums}
.riskbar{display:inline-flex;align-items:center;gap:7px}
.riskbar .track{width:52px;height:6px;border-radius:4px;background:rgba(120,150,200,.15);overflow:hidden}
.riskbar .fill{height:100%;border-radius:4px}

/* Digital twin */
.twingrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.tile{padding:16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--stroke);cursor:pointer;transition:.16s;position:relative;overflow:hidden}
.tile:hover{transform:translateY(-2px);border-color:var(--stroke2);box-shadow:0 14px 40px rgba(0,0,0,.5)}
.tile .nm{font-weight:650;font-size:14.5px}
.tile .meta{color:var(--muted);font-size:12px;margin-top:3px}
.tile .aura{position:absolute;inset:0;opacity:.10;pointer-events:none}
.leds{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.led{width:15px;height:15px;border-radius:4px;position:relative;cursor:pointer;transition:.15s}
.led:hover{transform:scale(1.28);z-index:2}
.led.crit{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--crit-glow)}50%{box-shadow:0 0 0 4px rgba(244,63,94,0)}}
.frontpanel{display:flex;flex-wrap:wrap;gap:5px;padding:12px;background:var(--panelfr);border:1px solid var(--stroke);border-radius:10px}
.port{width:20px;height:26px;border-radius:3px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;cursor:pointer;background:var(--port);border:1px solid var(--stroke2)}
.port .pl{width:9px;height:5px;border-radius:2px}

/* Charts */
.chart{position:relative}
.chart svg{width:100%;display:block;overflow:visible;touch-action:none}
.chart svg.grabbing{cursor:grabbing}
.chart text.ax{fill:var(--muted2)}
.chart line.gl{stroke:var(--gridline)}
svg.donut .dt{fill:var(--txt)}
svg.donut .ax{fill:var(--muted2)}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--stroke2);backdrop-filter:blur(12px);border-radius:9px;padding:8px 11px;font-size:11.5px;box-shadow:var(--shadow);z-index:6;display:none;min-width:150px;line-height:1.55}
.tip b{font-variant-numeric:tabular-nums}
.tip .trow{display:flex;align-items:center;gap:6px}
.tip .trow i{width:8px;height:8px;border-radius:2px;flex:none}
.tip .trow b{margin-left:auto;padding-left:10px}
.ctools{position:absolute;top:4px;right:4px;display:flex;gap:4px;z-index:5;opacity:0;transition:.18s}
.chart:hover .ctools{opacity:1}
.ctools button{background:var(--panel);border:1px solid var(--stroke2);border-radius:6px;width:25px;height:23px;font-size:13px;line-height:1;color:var(--muted);padding:0}
.ctools button:hover{color:var(--txt)}
.crosshair{stroke:var(--muted2);stroke-dasharray:2 3;opacity:.75}
.hintzoom{position:absolute;bottom:2px;right:8px;font-size:10px;color:var(--muted2);opacity:0;transition:.25s;pointer-events:none}
.chart:hover .hintzoom{opacity:.75}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.heat{display:grid;grid-template-columns:34px repeat(24,1fr);gap:2px;font-size:9px}
.heat .cell{aspect-ratio:1;border-radius:2px}
.heat .hr{color:var(--muted2);text-align:center;line-height:14px}
.heat .dl{color:var(--muted2);line-height:1;display:flex;align-items:center}
.heat .tlh{color:var(--muted2);font-size:8px;text-align:left;border-left:1px solid var(--stroke2);padding-left:1px;line-height:10px;height:10px}
.heat .cell.selcell{outline:2px solid var(--accent);outline-offset:1px;position:relative;z-index:2}
.cal{display:flex;gap:3px;flex-wrap:wrap}
.cal .d{width:13px;height:13px;border-radius:3px}

/* Forms / uploads */
.dz{border:1.5px dashed var(--stroke2);border-radius:var(--r);padding:36px;text-align:center;color:var(--muted);transition:.16s;background:rgba(56,189,248,.03)}
.dz.drag{border-color:var(--accent);background:rgba(56,189,248,.09);color:var(--txt)}
.btn{background:linear-gradient(180deg,#2b93cf,#1f7fbf);border:1px solid rgba(120,180,240,.4);border-radius:9px;padding:9px 15px;font-weight:650;color:#fff;box-shadow:0 6px 18px rgba(31,127,191,.3)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel);box-shadow:none;color:var(--txt);border:1px solid var(--stroke2)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],input[type=datetime-local],select,textarea{
  background:var(--bg2);border:1px solid var(--stroke2);border-radius:8px;padding:8px 10px;color:var(--txt);font:inherit;outline:0}
input:focus,select:focus{border-color:var(--accent)}
label.fld{display:block;margin:10px 0}
label.fld>span{display:block;color:var(--muted);font-size:11.5px;font-weight:600;margin-bottom:5px}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
.sev-block{border-left:3px solid;padding:10px 14px;border-radius:8px;margin-bottom:10px;background:var(--panel2)}
.sev-block.block{border-color:var(--critical)}.sev-block.warn{border-color:var(--warning)}.sev-block.info{border-color:var(--accent)}
.map-row{display:grid;grid-template-columns:1fr 20px 1fr 90px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(120,150,200,.07)}
.confbar{height:5px;border-radius:3px;background:rgba(120,150,200,.15);overflow:hidden;margin-top:4px}
.confbar>i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#818cf8)}

.tl{position:relative;margin-left:8px;padding-left:18px;border-left:2px solid var(--stroke2)}
.tl .ev{position:relative;margin-bottom:14px}
.tl .ev:before{content:"";position:absolute;left:-25px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--bg)}
.tl .ev.critical:before{background:var(--critical)}.tl .ev.warning:before{background:var(--warning)}
.tl .ev.maint:before{background:var(--accent2)}.tl .ev .tm{color:var(--muted2);font-size:11px}
.small{font-size:12px;color:var(--muted)}
.toast{position:fixed;right:20px;bottom:20px;background:var(--panel);border:1px solid var(--stroke2);border-radius:10px;padding:12px 16px;box-shadow:var(--shadow);z-index:99;backdrop-filter:blur(14px);animation:slidein .25s}
@keyframes slidein{from{transform:translateY(12px);opacity:0}}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty .big{font-size:40px;margin-bottom:10px;opacity:.6}
.split{display:flex;gap:10px;flex-wrap:wrap}
.ai{background:linear-gradient(135deg,rgba(56,189,248,.09),rgba(129,140,248,.07));border:1px solid var(--stroke2);border-radius:12px;padding:13px 15px}
.ai .h{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
.ai p{margin:0;font-size:13px;color:var(--ai-txt);line-height:1.6}
.dist-legend{display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.dist-legend .row{display:flex;align-items:center;gap:9px}
.dist-legend .row i{width:11px;height:11px;border-radius:3px}
.dist-legend .row b{margin-left:auto;font-variant-numeric:tabular-nums}
.mini{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:10px;width:fit-content;margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:7px 13px;border-radius:7px;color:var(--muted);font-weight:600;font-size:12.5px}
.tabs button.active{background:var(--panel);color:var(--txt);box-shadow:inset 0 0 0 1px var(--stroke2)}
.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}

/* ------------------------- Fluid animation layer ------------------------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px) scale(.99)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes drawLine{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fadeArea{from{opacity:0}to{opacity:.13}}
@keyframes growBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes floatBlob{0%{transform:translate(0,0)}50%{transform:translate(46px,-34px)}100%{transform:translate(0,0)}}
@keyframes floatBlob2{0%{transform:translate(0,0)}50%{transform:translate(-54px,26px)}100%{transform:translate(0,0)}}
@keyframes breathe{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes ledBreathe{0%,100%{box-shadow:0 0 0 0 rgba(45,212,191,0)}50%{box-shadow:0 0 6px 0 rgba(45,212,191,.35)}}

/* slow drifting glassmorphic light — depth behind the translucent panels */
body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;
  background:radial-gradient(520px 520px at 28% 38%,rgba(56,189,248,.11),transparent 62%);animation:floatBlob 24s ease-in-out infinite}
body::after{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;
  background:radial-gradient(620px 620px at 72% 62%,rgba(129,140,248,.11),transparent 62%);animation:floatBlob2 30s ease-in-out infinite}

/* staggered entrance for cards on every view render */
.reveal{animation:fadeUp .52s cubic-bezier(.22,.61,.36,1) both}
#main.swap{animation:fadeIn .3s ease both}

/* hover lift */
.kpi{transition:transform .2s cubic-bezier(.22,.61,.36,1),box-shadow .2s}
.kpi:hover{transform:translateY(-3px);box-shadow:0 18px 44px rgba(0,0,0,.5)}
.panel{transition:transform .2s cubic-bezier(.22,.61,.36,1),box-shadow .2s,border-color .2s}
.verdict{transition:transform .2s cubic-bezier(.22,.61,.36,1),box-shadow .2s}
.verdict[data-nav]:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(0,0,0,.45)}
.pill,.chip{transition:transform .15s} .navitem .badge{animation:breathe 2s ease-in-out infinite}

/* chart draw-on */
.chart path.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:drawLine 1.15s cubic-bezier(.4,0,.2,1) forwards}
.chart path.drawdash{opacity:0;animation:fadeIn .55s .55s ease forwards}
.chart path.areafill{opacity:0;animation:fadeArea .8s .28s ease forwards}
svg.donut{animation:popIn .55s cubic-bezier(.22,.61,.36,1) both}
@keyframes dotPulse{0%,100%{r:5.5}50%{r:7.5}}
circle.evsel{animation:dotPulse 1.1s ease-in-out infinite}
line.selline{animation:fadeIn .3s ease both}

/* growing bars (width-agnostic via scaleX) */
.riskbar .fill,.confbar>i,.track>i{transform-origin:left;animation:growBar .95s cubic-bezier(.22,.61,.36,1) both}

/* healthy-LED gentle breathe, critical already pulses */
.led{animation:popIn .4s ease both}
.port .pl{transition:box-shadow .2s}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div id="app">

<script>
"use strict";
/* ============================================================================
   NetPulse — single-file offline Network Analytics & Capacity Planning app.
   No external/CDN dependencies. Parses XLSX (via browser DecompressionStream)
   and CSV entirely in-browser; persists to IndexedDB. Implements the header-
   intelligence + unit-normalization + analytics/verdict/capacity/anomaly/risk
   engines described in the /diff spec.
============================================================================ */

/* ---------------------------------- utils --------------------------------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const fmtBps=v=>{v=+v||0;const u=['bps','Kbps','Mbps','Gbps','Tbps'];let i=0;while(v>=1000&&i<u.length-1){v/=1000;i++;}return v.toFixed(v>=100?0:v>=10?1:2)+' '+u[i];};
const fmtPct=v=>(v==null||isNaN(v))?'–':(v*100).toFixed(v<0.1?1:0)+'%';
const pct1=v=>(v==null||isNaN(v))?'–':(v*100).toFixed(1)+'%';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate=t=>new Date(t).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const fmtDay=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const dtLocal=ts=>{const d=new Date(ts);const p2=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`;};
const days=(a,b)=>(b-a)/86400000;
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function toast(msg){const t=$('#toast');t.innerHTML=`<div class="toast">${msg}</div>`;setTimeout(()=>t.innerHTML='',3200);}
function stateColor(s){return getComputedStyle(document.documentElement).getPropertyValue('--'+s).trim()||'#888';}
function levDist(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function simRatio(a,b){if(!a||!b)return 0;const L=Math.max(a.length,b.length);return 1-levDist(a,b)/L;}
function percentile(arr,p){if(!arr.length)return 0;const a=[...arr].sort((x,y)=>x-y);const i=clamp(p,0,1)*(a.length-1);const lo=Math.floor(i),hi=Math.ceil(i);return a[lo]+(a[hi]-a[lo])*(i-lo);}
function mean(a){return a.length?a.reduce((s,x)=>s+x,0)/a.length:0;}
function std(a){if(a.length<2)return 0;const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)));}
// Stack-safe min/max — Math.max(...arr) throws on large arrays (100k+ args).
function amax(a,seed=-Infinity){let m=seed;for(let i=0;i<a.length;i++)if(a[i]>m)m=a[i];return m===-Infinity?0:m;}
function amin(a,seed=Infinity){let m=seed;for(let i=0;i<a.length;i++)if(a[i]<m)m=a[i];return m===Infinity?0:m;}
// String interning: device/interface/ifid repeat on every row but have very few
// distinct values. Sharing one string object per value instead of one per row cuts
// hundreds of MB at million-row scale (numbers are cheap; repeated strings are not).
const _intern=new Map();
function intern(s){let v=_intern.get(s);if(v===undefined){_intern.set(s,s);v=s;}return v;}

/* --------------------------- IndexedDB (kv store) ------------------------- */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('netpulse',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{IDB.db=r.result;res();};r.onerror=()=>rej(r.error);});},
  get(k){return new Promise(res=>{const t=IDB.db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>res(undefined);});},
  put(k,v){return new Promise((res,rej)=>{const t=IDB.db.transaction('kv','readwrite').objectStore('kv').put(v,k);t.onsuccess=()=>res();t.onerror=()=>rej(t.error);});},
  del(k){return new Promise(res=>{const t=IDB.db.transaction('kv','readwrite').objectStore('kv').delete(k);t.onsuccess=()=>res();t.onerror=()=>res();});}
};

/* --------------------------------- state ---------------------------------- */
const DEFAULT_CFG={
  thresholds:{warn:0.60,high:0.75,crit:0.90},
  classThresholds:{Trading:{warn:0.45,high:0.60,crit:0.80},Backup:{warn:0.75,high:0.88,crit:0.96}},
  businessHours:{startHr:9,endHr:17,days:[1,2,3,4,5]},
  riskWeights:{peak:0.9,avg:0.7,trend:0.8,growth:0.7,violations:1.0,anomaly:0.6,impact:1.2},
  planHorizonDays:90, upgradeLeadDays:42,
  thresholdsOff:null, // optional separate bands for non-business hours (null = same as business)
  // Link-upgrade policy — editable: recommend/auto-flag upgrade when utilization
  // crosses utilPct on `days` distinct days (optionally business-hours only).
  upgradeRule:{utilPct:80, days:5, businessHoursOnly:true, mode:'recommend'}
};
const S={cfg:structuredClone(DEFAULT_CFG),samples:[],batches:[],audit:[],maintenance:[],comments:{},ifmeta:{},ifinfo:{},rca:{},watch:[],watchWin:90,
  role:'Admin', view:'exec', scope:{}, analytics:null, staged:null, aiMode:'tech'};

async function loadAll(){
  await IDB.open();
  S.batches=(await IDB.get('batches'))||[];
  // Samples are stored per-batch (key spl:<batchId>) so a commit or a delete only
  // writes/removes its own slice — never re-serializing the whole 6-month dataset.
  const legacy=await IDB.get('samples');
  if(legacy&&legacy.length){ // migrate old single-blob storage → per-batch keys
    const byB={};for(const x of legacy){(byB[x.batch]=byB[x.batch]||[]).push(x);}
    for(const bid in byB)await IDB.put('spl:'+bid,byB[bid]);
    await IDB.del('samples');
    S.samples=legacy;
  }else{
    let all=[];
    for(const b of S.batches){const arr=await IDB.get('spl:'+b.id);if(arr&&arr.length)all=all.concat(arr);}
    S.samples=all;
  }
  S.audit=(await IDB.get('audit'))||[];
  S.maintenance=(await IDB.get('maintenance'))||[];
  S.comments=(await IDB.get('comments'))||{};
  S.ifmeta=(await IDB.get('ifmeta'))||{};
  S.ifinfo=(await IDB.get('ifinfo'))||{};
  S.rca=(await IDB.get('rca'))||{};
  S.watch=(await IDB.get('watch'))||[];
  try{S.watchWin=+(localStorage.getItem('np-watchwin'))||90;}catch(e){}
  try{S.aiMode=localStorage.getItem('np-aimode')||'tech';}catch(e){}
  const cfg=await IDB.get('cfg'); if(cfg)S.cfg=Object.assign(structuredClone(DEFAULT_CFG),cfg);
}
const save=(k)=>IDB.put(k,S[k==='cfg'?'cfg':k]);
function logAudit(action,target,detail){S.audit.unshift({ts:Date.now(),who:S.role,action,target:target||'',detail:detail||''});S.audit=S.audit.slice(0,500);save('audit');}

/* ============================ INGESTION LAYER ============================== */
/* Header understanding — semantic, NOT hardcoded by position/name. */
/* Canonical fields. Semantics match real polling exports:
   - speedtx / speedrx  → "Transmit/Received Bandwidth" = interface CAPACITY per direction
   - tx / rx            → "Average Transmit/Receive"    = average traffic rate
   - ptx / prx          → "Peak Transmit/Receive"       = peak traffic rate in the interval
   - txpct/rxpct/ptxpct/prxpct → the same as percentages
   Nothing is hardcoded to a header name or position — aliases + fuzzy + value-shape
   propose a mapping, and the user can override EVERY field in the mapping panel. */
const FIELD_ALIASES={
  device:['device','host','hostname','node','nodename','sysname','router','switch','dev','equipment','chassis'],
  interface:['interface','interfacename','intf','port','ifname','ifdescr','portname','name','if'],
  ts:['time','timestamp','poll','polltime','polltimestamp','datetime','date','pollts','polledat','polled','when','sampletime','pollingtime'],
  tx:['tx','out','egress','transmit','transmitted','transmitbps','transmittedbps','averagetransmit','avgtransmit','averagetx','avgtx','averageout','avgout','transmitaverage','txaverage','transmitrate','outbound','txrate','outoctets','outbits','outbps','outbytes','txbps','sent','snd','txbits','outrate','txtraffic','outtraffic'],
  rx:['rx','in','ingress','receive','received','receivedbps','receivebps','averagereceive','avgreceive','averagereceived','averagerx','avgrx','averagein','avgin','receiveaverage','rxaverage','receiverate','inbound','rxrate','inoctets','inbits','inbps','inbytes','rxbps','recv','rcv','rxbits','inrate','rxtraffic','intraffic'],
  ptx:['peaktransmit','transmitpeak','peaktx','txpeak','peakout','maxtx','maxtransmit','peaktxbps','peakegress','maxout'],
  prx:['peakreceive','peakreceived','receivepeak','peakrx','rxpeak','peakin','maxrx','maxreceive','peakrxbps','peakingress','maxin'],
  speed:['speed','bandwidth','bw','capacity','referencebandwidth','refbandwidth','refbw','totalbandwidth','ifspeed','portspeed','linkspeed','ifspeedbps','maxspeed','negspeed'],
  speedtx:['transmitbandwidth','txbandwidth','bandwidthtransmit','bandwidthtx','transmitcapacity','txcapacity','transmitspeed','txspeed','outbandwidth','bandwidthout','outspeed'],
  speedrx:['receivedbandwidth','receivebandwidth','rxbandwidth','bandwidthreceive','bandwidthrx','receivecapacity','rxcapacity','receivespeed','rxspeed','inbandwidth','bandwidthin','inspeed'],
  util:['util','utilization','utilisation','usage','percent','percentage','pct','load','utilpct','utilizationpercentage','percentused','busy','totalpercentutilization','totalpercent','totalutilization','overallutilization'],
  txpct:['averagetransmitpercent','averagetransmitpercentage','transmitpercent','transmitpercentage','transmitpercentutilization','transmitutilizationpercent','txpercent','txpct','txutil','txutilization','outpercent','transmitutilization','avgtransmitpercent'],
  rxpct:['averagereceivepercent','averagereceivepercentage','receivepercent','receivepercentage','receivedpercentutilization','receivepercentutilization','receivedpercent','receivedpercentage','receiveutilizationpercent','rxpercent','rxpct','rxutil','rxutilization','inpercent','receiveutilization','avgreceivepercent'],
  ptxpct:['peaktransmitpercent','peaktransmitpercentage','peaktxpercent','peaktxpct','peakoutpercent','peaktransmitutilization'],
  prxpct:['peakreceivepercent','peakreceivepercentage','peakrxpercent','peakrxpct','peakinpercent','peakreceiveutilization'],
  site:['site','sitename','location','datacenter','dc','region','pop','facility','building'],
  ip:['ip','ipaddress','ipaddr','mgmtip','managementip','address'],
  linkname:['linkname','link','circuit','circuitname','circuitid','linkid','descr','ifalias','alias','linkdescription']
};
const FIELD_LABELS={
  device:'Device',interface:'Interface',ts:'Poll timestamp',
  tx:'Average Transmit (rate)',rx:'Average Receive (rate)',
  ptx:'Peak Transmit (rate)',prx:'Peak Receive (rate)',
  speed:'Interface bandwidth (both directions)',
  speedtx:'Transmit bandwidth (capacity)',speedrx:'Received bandwidth (capacity)',
  util:'Utilization % (overall / total)',
  txpct:'Transmit % utilization',rxpct:'Receive % utilization',
  ptxpct:'Peak Transmit %',prxpct:'Peak Receive %',
  site:'Site (from file)',ip:'IP address',linkname:'Link name / circuit'
};
const REQUIRED_FIELDS=['device','interface','ts'];
const norm=s=>String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]/g,'');
const UNIT_RE=/(\d+(?:\.\d+)?)\s*(t|g|m|k)?\s*(b(?:it|ps|\/s)?|bytes?|o(?:ctet)?s?|bps)/i;

function unitMultiplierFromToken(tok){ // returns {mult, isByte} bits-per-second multiplier or null
  if(!tok)return null; const t=tok.toLowerCase();
  const isByte=/byte|octet|bytes|\bb(?![ip])/.test(t)&&!/bit|bps/.test(t)||/[gmk]?b\b/.test(t)&&/bytes|octet/.test(t);
  let scale=1;
  if(/\bt/.test(t)||/tbps|tbit|tb\b/.test(t))scale=1e12;
  else if(/\bg/.test(t)||/gbps|gbit|gb\b|gig/.test(t))scale=1e9;
  else if(/\bm/.test(t)||/mbps|mbit|mb\b|meg/.test(t))scale=1e6;
  else if(/\bk/.test(t)||/kbps|kbit|kb\b/.test(t))scale=1e3;
  const byte=/byte|octet/.test(t);
  if(!/b|octet|bps/.test(t))return null;
  return {mult:scale*(byte?8:1),byte};
}
function headerUnit(h){ // detect explicit unit inside a header string
  const m=String(h).toLowerCase().match(/\(?\s*(t|g|m|k)?\s*(bps|bit\/s|bits?|bytes?|octets?|b\/s)\s*\)?/);
  if(!m)return null; const info=unitMultiplierFromToken(m[0]); if(!info)return null;
  if(/%|percent|util/.test(String(h).toLowerCase()))return null;
  return info;
}
function parseSpeed(raw){
  if(raw==null||raw==='')return null;
  if(typeof raw==='number'){ if(raw>=1e6)return raw; if(raw>=1000)return raw*1e6; if(raw>=1)return raw*1e9; return raw; }
  const s=String(raw).toLowerCase().trim().replace(/,/g,'');
  const m=s.match(/([\d.]+)\s*(t|g|m|k)?\s*(bps|bit|b|e|gig|meg)?/);
  if(!m)return null; let v=parseFloat(m[1]); const u=m[2];
  if(u==='t')v*=1e12;else if(u==='g')v*=1e9;else if(u==='m')v*=1e6;else if(u==='k')v*=1e3;
  else{ if(v>=1e6){} else if(v>=1000)v*=1e6; else v*=1e9; }
  return v;
}
function parseTs(raw){
  if(raw==null||raw==='')return null;
  if(typeof raw==='number'){ if(raw>20000&&raw<80000)return Math.round((raw-25569)*86400000); if(raw>1e11)return raw; if(raw>1e9)return raw*1000; }
  const s=String(raw).trim();
  if(/^\d+(\.\d+)?$/.test(s)){const n=parseFloat(s);if(n>20000&&n<80000)return Math.round((n-25569)*86400000);if(n>1e11)return n;if(n>1e9)return n*1000;}
  // day-first dates: 22-06-2026 00:30 (common in exports; JS Date.parse chokes on these)
  const dm=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if(dm){const A=+dm[1],B=+dm[2];const d=A>12?A:(B>12?B:A),mo=A>12?B:(B>12?A:B);
    const t=new Date(+dm[3],mo-1,d,+(dm[4]||0),+(dm[5]||0),+(dm[6]||0)).getTime();if(!isNaN(t))return t;}
  const t=Date.parse(s.replace(' ','T')); if(!isNaN(t))return t;
  const t2=Date.parse(s); return isNaN(t2)?null:t2;
}
function parseRate(raw,headerInfo){ // → bits/sec ; {val, viaCellUnit, unit:true if ANY explicit unit was applied}
  if(raw==null||raw==='')return {val:null};
  if(typeof raw==='number'){ if(headerInfo)return {val:raw*headerInfo.mult,unit:true}; return {val:raw}; }
  const s=String(raw).trim().replace(/,/g,''); // strip thousand separators BEFORE unit match ("1,700.00 Mbps")
  const m=s.match(UNIT_RE);
  if(m){const info=unitMultiplierFromToken(m[0]);if(info)return {val:parseFloat(m[1])*info.mult,viaCellUnit:true,unit:true};}
  const n=parseFloat(s.replace(/ /g,'')); if(isNaN(n))return {val:null};
  return headerInfo?{val:n*headerInfo.mult,unit:true}:{val:n};
}

/* Resolve columns to canonical fields by MEANING (alias+fuzzy+value-shape). */
function resolveColumns(headers,rows){
  const H=headers.map((h,i)=>({i,raw:h,n:norm(h),unit:headerUnit(h)}));
  const scores={}; // field -> [{i,score}]
  for(const f in FIELD_ALIASES){
    scores[f]=H.map(h=>{
      let best=0;
      for(const a of FIELD_ALIASES[f]){
        if(h.n===a)best=Math.max(best,1);
        else if(h.n.includes(a)||a.includes(h.n))best=Math.max(best,0.82);
        else best=Math.max(best,simRatio(h.n,a)*0.75);
      }
      return {i:h.i,score:best};
    });
  }
  // value-shape signals from sampled rows
  const col=i=>rows.slice(0,40).map(r=>r[i]).filter(v=>v!=null&&v!=='');
  const shape=H.map(h=>{
    const c=col(h.i); if(!c.length)return {};
    let dates=0,pcts=0,nums=0,big=0,mono=true,prev=-Infinity,ints=0;
    for(const v of c){const s=String(v);if(parseTs(v)&&(isNaN(+s)|| +s>20000))dates++;if(/%/.test(s)||(+v>=0&&+v<=100&&/\./.test(s)===false&&+v>1))pcts++;const n=+String(v).replace(/[^\d.-]/g,'');if(!isNaN(n)){nums++;if(n>1e5)big++;if(Number.isInteger(n))ints++;if(n<prev)mono=false;prev=n;}}
    return {date:dates/c.length,pct:pcts/c.length,num:nums/c.length,big:big/c.length,mono:mono&&ints/c.length>.8&&big/c.length>.5};
  });
  // Global greedy assignment: the strongest (field, column) pairs win first,
  // so an exact "Received Bandwidth"→speedrx beats a partial "received…"→rx.
  const usedH=new Set(),usedF=new Set(),map={},conf={};
  const order=['ts','device','interface','speed','speedtx','speedrx','tx','rx','ptx','prx','util','txpct','rxpct','ptxpct','prxpct','site','ip','linkname'];
  const PCT_FIELDS=new Set(['util','txpct','rxpct','ptxpct','prxpct']);
  const RATE_FIELDS=new Set(['tx','rx','ptx','prx']);
  const cand=[];
  for(const f of order)for(const s of scores[f]){
    let sc=s.score;const sh=shape[s.i]||{};const hn=H[s.i].n;
    const isPctHdr=/%|percent|pct|util/i.test(String(H[s.i].raw||''));
    if(f==='ts')sc+=(sh.date||0)*0.6;
    if(PCT_FIELDS.has(f)){sc+=(sh.pct||0)*0.35+(isPctHdr?0.3:0);}
    if(RATE_FIELDS.has(f)){sc+=(sh.num||0)*0.05;if(isPctHdr)sc-=0.45;} // "Average Transmit %" must not become a rate column
    if(f==='speed'){sc+=(sh.big||0)*0.15;if(/transmit|receiv|egress|ingress/.test(hn))sc-=0.5;if(isPctHdr)sc-=0.5;}
    if(f==='speedtx'||f==='speedrx'){sc+=(sh.big||0)*0.1;if(isPctHdr)sc-=0.5;}
    cand.push({f,i:s.i,raw:sc,score:clamp(sc,0,1)});
  }
  cand.sort((a,b)=>b.raw-a.raw); // raw keeps exact-alias wins ahead of boosted partial matches
  for(const c of cand){
    if(usedF.has(c.f)||usedH.has(c.i))continue;
    const need=REQUIRED_FIELDS.includes(c.f);
    if(c.score>=(need?0.42:0.5)){map[c.f]=c.i;conf[c.f]=c.score;usedH.add(c.i);usedF.add(c.f);}
  }
  // fallback: if no ts column matched but a column is mostly dates
  if(map.ts==null){const d=shape.map((s,i)=>({i:H[i].i,d:s.date||0})).sort((a,b)=>b.d-a.d)[0];if(d&&d.d>0.6){map.ts=d.i;conf.ts=d.d;}}
  return {map,conf,headers:H,shape};
}

function buildSamples(rows,resolved,srcName,batchId){
  const {map,headers}=resolved;
  const hInfo=f=>map[f]!=null?(headers.find(h=>h.i===map[f])||{}).unit:null;
  const units={tx:hInfo('tx'),rx:hInfo('rx'),ptx:hInfo('ptx'),prx:hInfo('prx')};
  const out=[],issues={corrupt:0,noTs:0,noSpeed:0,utilRecalc:0,cellUnit:0};
  let scaleGuessNote=null;
  const val=(r,f)=>map[f]!=null?r[map[f]]:null;
  const num=(r,f)=>{const v=val(r,f);if(v==null||v==='')return null;const n=parseFloat(String(v).replace(/[^\d.eE+-]/g,''));return isNaN(n)?null:n;};
  const raw=[];
  const info={};
  for(const r of rows){
    const dev=String(val(r,'device')??'').trim(),intf=String(val(r,'interface')??'').trim();
    if(!dev||!intf)continue;
    const st=String(val(r,'site')??'').trim(),ipv=String(val(r,'ip')??'').trim(),ln=String(val(r,'linkname')??'').trim();
    if(st||ipv||ln){const o=info[dev+'|'+intf]=info[dev+'|'+intf]||{};if(st)o.site=st;if(ipv)o.ip=ipv;if(ln)o.linkname=ln;}
    const ts=parseTs(val(r,'ts'));if(ts==null){issues.noTs++;continue;}
    const tx=map.tx!=null?parseRate(val(r,'tx'),units.tx):{val:null};
    const rx=map.rx!=null?parseRate(val(r,'rx'),units.rx):{val:null};
    const ptx=map.ptx!=null?parseRate(val(r,'ptx'),units.ptx):{val:null};
    const prx=map.prx!=null?parseRate(val(r,'prx'),units.prx):{val:null};
    if(tx.viaCellUnit||rx.viaCellUnit)issues.cellUnit++;
    // Per-direction capacity ("Transmit/Received Bandwidth"); shared speed as fallback.
    const sp=map.speed!=null?parseSpeed(val(r,'speed')):null;
    const spTx=(map.speedtx!=null?parseSpeed(val(r,'speedtx')):null)||sp;
    const spRx=(map.speedrx!=null?parseSpeed(val(r,'speedrx')):null)||sp;
    raw.push({dev,intf,ts,tx:tx.val,rx:rx.val,ptx:ptx.val,prx:prx.val,spTx,spRx,
      tU:tx.unit,rU:rx.unit,pTU:ptx.unit,pRU:prx.unit,
      txp:num(r,'txpct'),rxp:num(r,'rxpct'),ptxp:num(r,'ptxpct'),prxp:num(r,'prxpct'),utilCol:num(r,'util')});
  }
  // Magnitude inference — per column, and ONLY for values that carried no explicit
  // unit (neither in the cell text nor the header). A value that arrived as
  // "25.41 Mbps" is already correct bps and must NEVER be rescaled — a file that
  // mixes text cells and plain numeric cells would otherwise get the unit-tagged
  // values blown up by the correction meant for the unit-less ones.
  {
    const inferCols=[['tx','tU'],['rx','rU'],['ptx','pTU'],['prx','pRU']];
    const scaled=[];
    for(const [col,flag] of inferCols){
      const un=raw.filter(x=>x[col]!=null&&x[col]>0&&!x[flag]&&(x.spTx>0||x.spRx>0));
      if(un.length<10)continue;
      const med=percentile(un.map(x=>x[col]/Math.max(x.spTx||0,x.spRx||0)),0.5);
      let factor=1;
      if(med>1.5&&med<=3000)factor=1e-6;
      else if(med>3000)factor=1e-9;
      else if(med>0&&med<0.0005)factor=1e6;
      if(factor!==1){for(const x of raw)if(x[col]!=null&&!x[flag])x[col]*=factor;scaled.push(`${col} ×${factor}`);}
    }
    if(scaled.length)scaleGuessNote=`Auto-scaled unit-less values (${scaled.join(', ')}) from magnitude vs interface bandwidth; values carrying an explicit unit were left untouched.`;
  }
  for(const x of raw){
    const spT=x.spTx,spR=x.spRx;
    let tx=x.tx,rx=x.rx,ptx=x.ptx,prx=x.prx;
    // Derive missing rates from their percentage columns (% of the direction's capacity)
    if(tx==null&&x.txp!=null&&spT)tx=x.txp/100*spT;
    if(rx==null&&x.rxp!=null&&spR)rx=x.rxp/100*spR;
    if(ptx==null&&x.ptxp!=null&&spT)ptx=x.ptxp/100*spT;
    if(prx==null&&x.prxp!=null&&spR)prx=x.prxp/100*spR;
    const speed=Math.max(spT||0,spR||0)||null;
    if(!speed)issues.noSpeed++;
    // Average utilization: each direction against its OWN capacity (asymmetric links exist)
    const uT=spT&&tx!=null?tx/spT:(x.txp!=null?x.txp/100:null);
    const uR=spR&&rx!=null?rx/spR:(x.rxp!=null?x.rxp/100:null);
    let util=(uT!=null||uR!=null)?Math.max(uT??0,uR??0):(x.utilCol!=null?x.utilCol/100:null);
    if(util!=null&&x.utilCol!=null&&Math.abs(x.utilCol/100-util)>0.15)issues.utilRecalc++;
    // Peak utilization from the peak columns — catches microbursts the averages hide
    const pT=spT&&ptx!=null?ptx/spT:(x.ptxp!=null?x.ptxp/100:null);
    const pR=spR&&prx!=null?prx/spR:(x.prxp!=null?x.prxp/100:null);
    let pu=(pT!=null||pR!=null)?Math.max(pT??0,pR??0):null;
    // Physically impossible values (rate above link capacity / util > 120%) are
    // counter-wrap or export artifacts — flag them so they are excluded from
    // analytics, charts and reports consistently, never silently mixed in.
    let bad=0;
    if(util!=null&&(util<0||util>1.2))bad=1;
    if(!bad&&((spT&&tx!=null&&tx>spT*1.2)||(spR&&rx!=null&&rx>spR*1.2)))bad=1;
    if(bad)issues.corrupt++;
    if(pu!=null&&pu>1.2){if(!bad)issues.corrupt++;pu=null;ptx=null;prx=null;}
    const dv=intern(x.dev),it=intern(x.intf);
    out.push({ifid:intern(dv+'|'+it),dev:dv,intf:it,ts:x.ts,tx,rx,ptx,prx,pu,
      speed,speedTx:spT||null,speedRx:spR||null,util,bad:bad||undefined,batch:batchId});
  }
  const extremes=[...out].filter(x=>x.util!=null).sort((a,b)=>(b.util||0)-(a.util||0)).slice(0,5);
  return {samples:out,issues,scaleGuessNote,info,extremes};
}

/* --------- CSV & XLSX readers (fully offline) --------- */
function parseCSV(text){
  const rows=[];let i=0,f='',row=[],q=false;
  while(i<text.length){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else{if(c==='"')q=true;else if(c===','){row.push(f);f='';}else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}else if(c!=='\r')f+=c;}
    i++;}
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
async function inflateRaw(u8){
  if('DecompressionStream'in window){
    const ds=new DecompressionStream('deflate-raw');
    const ab=await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer();
    return new Uint8Array(ab);
  }
  throw new Error('DecompressionStream unavailable');
}
function parseZip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);let eocd=-1;
  for(let i=buf.byteLength-22;i>=0;i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}}
  if(eocd<0)throw new Error('Not a valid XLSX (no zip EOCD)');
  const count=dv.getUint16(eocd+10,true);let off=dv.getUint32(eocd+16,true);
  const entries={};
  for(let n=0;n<count;n++){
    if(dv.getUint32(off,true)!==0x02014b50)break;
    const method=dv.getUint16(off+10,true),csize=dv.getUint32(off+20,true);
    const fnLen=dv.getUint16(off+28,true),exLen=dv.getUint16(off+30,true),cmLen=dv.getUint16(off+32,true);
    const lho=dv.getUint32(off+42,true);
    const name=new TextDecoder().decode(u8.subarray(off+46,off+46+fnLen));
    const lfn=dv.getUint16(lho+26,true),lex=dv.getUint16(lho+28,true);
    const dstart=lho+30+lfn+lex;
    entries[name]={method,data:u8.subarray(dstart,dstart+csize)};
    off+=46+fnLen+exLen+cmLen;
  }
  return entries;
}
async function entryText(e){if(!e)return null;const raw=e.method===0?e.data:await inflateRaw(e.data);return new TextDecoder().decode(raw);}
function colToNum(ref){const m=ref.match(/^([A-Z]+)/);if(!m)return 0;let n=0;for(const ch of m[1])n=n*26+(ch.charCodeAt(0)-64);return n-1;}
async function parseXLSX(buf){
  const z=parseZip(buf);
  const shared=[];const ssx=await entryText(z['xl/sharedStrings.xml']);
  if(ssx){const doc=new DOMParser().parseFromString(ssx,'application/xml');for(const si of doc.getElementsByTagName('si')){shared.push(si.textContent);}}
  // pick first worksheet
  let sheetPath='xl/worksheets/sheet1.xml';
  const wbRels=await entryText(z['xl/_rels/workbook.xml.rels']);
  const names=Object.keys(z).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort();
  if(names.length)sheetPath=names[0];
  const sx=await entryText(z[sheetPath]); if(!sx)throw new Error('No worksheet found');
  const doc=new DOMParser().parseFromString(sx,'application/xml');
  const rows=[];
  for(const row of doc.getElementsByTagName('row')){
    const cells=[];let maxc=0,nextCol=0;
    for(const c of row.getElementsByTagName('c')){
      const ref=c.getAttribute('r');const ci=ref?colToNum(ref):nextCol;nextCol=ci+1;const t=c.getAttribute('t');
      const vEl=c.getElementsByTagName('v')[0];const isEl=c.getElementsByTagName('is')[0];
      let val=null;
      if(t==='s'&&vEl)val=shared[+vEl.textContent];
      else if(t==='inlineStr'&&isEl)val=isEl.textContent;
      else if(t==='str'&&vEl)val=vEl.textContent;
      else if(vEl)val=isNaN(+vEl.textContent)?vEl.textContent:+vEl.textContent;
      cells[ci]=val;maxc=Math.max(maxc,ci);
    }
    for(let k=0;k<=maxc;k++)if(cells[k]===undefined)cells[k]=null;
    rows.push(cells);

}
function findHeaderRow(rows){
  let best=0,bestScore=-1;
  for(let i=0;i<Math.min(rows.length,15);i++){
    const r=rows[i]||[];const nonEmpty=r.filter(c=>c!=null&&c!=='').length;
    const texty=r.filter(c=>typeof c==='string'&&/[a-z]/i.test(c)&&isNaN(+c)).length;
    const score=texty*2+nonEmpty - (r.filter(c=>typeof c==='number').length);
    if(nonEmpty>=3&&score>bestScore){bestScore=score;best=i;}
  }
  return best;
}

async function ingestFile(file){
  const name=file.name;const isCsv=/\.csv$/i.test(name);
  let matrix;
  if(isCsv){matrix=parseCSV(await file.text());}
  else{matrix=await parseXLSX(await file.arrayBuffer());}
  if(!matrix||!matrix.length)throw new Error('Empty file');
  const hr=findHeaderRow(matrix);
  const headers=matrix[hr].map(h=>String(h??''));
  const rows=matrix.slice(hr+1);
  const resolved=resolveColumns(headers,rows);
  return {name,headers,rows,resolved,headerRow:hr,rowCount:rows.length};
}

/* ------------------------------- validation ------------------------------- */
function validateStaged(parsed,built){
  const findings={block:[],warn:[],info:[]};
  const {map,conf}=parsed.resolved;
  REQUIRED_FIELDS.forEach(f=>{if(map[f]==null)findings.block.push(`Could not resolve a <b>${FIELD_LABELS[f]}</b> column — map it in the panel above to proceed.`);});
  if(map.tx==null&&map.rx==null&&map.util==null&&map.txpct==null&&map.rxpct==null)findings.block.push('No traffic column resolved (Average Transmit/Receive as rate or %, or overall Utilization %). Map one above.');
  if(map.speed==null&&map.speedtx==null&&map.speedrx==null&&map.util==null&&map.txpct==null&&map.rxpct==null)findings.warn.push('No interface bandwidth (capacity) column — utilization cannot be computed from rates.');
  // low-confidence mappings
  for(const f in conf){if(conf[f]<0.62)findings.warn.push(`Low-confidence mapping: <b>${f}</b> → “${esc(parsed.headers[map[f]])}” (${Math.round(conf[f]*100)}%). Confirm in the mapping panel.`);}
  const s=built.samples;
  if(s.length===0)findings.block.push('No valid rows produced after parsing.');
  // coverage / gaps — single pass per interface, stack-safe (no spread over big arrays)
  const byIf={};for(const x of s){(byIf[x.ifid]=byIf[x.ifid]||[]).push(x.ts);}
  let intervalNote='';const deltas=[];
  for(const k in byIf){const t=byIf[k];t.sort((a,b)=>a-b);for(let i=1;i<t.length;i++)deltas.push(t[i]-t[i-1]);}
  if(deltas.length){const med=percentile(deltas,0.5);intervalNote=`~${Math.round(med/60000)} min`;
    let gaps=0;for(const d of deltas)if(d>med*2.5)gaps++;
    if(gaps)findings.warn.push(`<b>${gaps}</b> polling gap(s) detected (missing intervals beyond ~2.5× the ${intervalNote} cadence).`);}
  if(built.issues.corrupt)findings.warn.push(`<b>${built.issues.corrupt}</b> physically impossible value(s) (rate above link capacity / utilization &gt;120% / negative) — excluded from analytics, charts and reports. These are usually poller counter-wrap artifacts; if a whole link is affected, its bandwidth column is wrong — fix the mapping or set a Speed override later in Link Manager.`);
  if(built.issues.utilRecalc)findings.info.push(`<b>${built.issues.utilRecalc}</b> row(s): supplied utilization disagreed with rate/speed — recomputed from normalized rates.`);
  if(built.issues.cellUnit)findings.info.push(`<b>${built.issues.cellUnit}</b> value(s) carried a per-cell unit (e.g. “1.5 Gbps”) — normalized to bps.`);
  if(built.scaleGuessNote)findings.info.push(esc(built.scaleGuessNote));
  // duplicate detection
  const chk=s.length+'|'+(s[0]?.ts||0)+'|'+(s.at(-1)?.ts||0);
  const dup=S.batches.find(b=>b.checksum===chk);
  if(dup)findings.warn.push(`Possible <b>duplicate upload</b>: coverage/size matches batch “${esc(dup.file)}” from ${fmtDate(dup.ts)}. Committing keeps both (idempotent by interface+timestamp).`);
  // overlap with existing samples
  const newKeys=new Set(s.slice(0,5000).map(x=>x.ifid+'@'+x.ts));
  let overlap=0;for(const x of S.samples){if(newKeys.has(x.ifid+'@'+x.ts)){overlap++;if(overlap>4999)break;}}
  if(overlap)findings.warn.push(`<b>${overlap.toLocaleString()}</b> sample(s) overlap existing data (same interface+timestamp). Overlaps are skipped on commit — history is never overwritten.`);
  // maintenance overlap
  let tmin=Infinity,tmax=-Infinity;for(const x of s){if(x.ts<tmin)tmin=x.ts;if(x.ts>tmax)tmax=x.ts;}
  if(S.maintenance.some(m=>m.start<tmax&&m.end>tmin))findings.info.push('Coverage intersects a maintenance window — affected samples will be tagged and excluded from alerts/SLA/trend.');
  // new entities
  const existIf=new Set(S.samples.map(x=>x.ifid));const newIf=new Set(s.map(x=>x.ifid).filter(i=>!existIf.has(i)));
  if(newIf.size)findings.info.push(`<b>${newIf.size}</b> new interface(s) will be created.`);
  built.checksum=chk;built.coverage=[tmin,tmax];built.intervalNote=intervalNote;built.overlap=overlap;
  return findings;
}
function coverageOf(samples){
  const ts=samples.map(x=>x.ts).filter(v=>v!=null);if(!ts.length)return {cov:[0,0],checksum:'0',intervalNote:''};
  ts.sort((a,b)=>a-b);const deltas=[];for(let i=1;i<ts.length;i++)deltas.push(ts[i]-ts[i-1]);
  const med=deltas.length?percentile(deltas,0.5):0;
  return {cov:[ts[0],ts.at(-1)],checksum:samples.length+'|'+ts[0]+'|'+ts.at(-1),intervalNote:med?`~${Math.round(med/60000)} min`:''};
}
// Write one already-built file as its own batch. Frees nothing here; caller drops refs.
async function commitOneFile(pf,map,existKeys){
  const batchId='b'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
  const batchSamples=[];
  for(const x of pf.built.samples){const k=x.ifid+'@'+x.ts;if(existKeys.has(k))continue;x.batch=batchId;
    if(S.maintenance.length&&S.maintenance.some(m=>m.start<=x.ts&&m.end>=x.ts&&(m.scope==='all'||m.target===x.ifid||m.target===x.dev)))x.maint=1;
    existKeys.add(k);batchSamples.push(x);}
  for(const x of batchSamples)S.samples.push(x);
  await IDB.put('spl:'+batchId,batchSamples);
  if(pf.built.info)for(const k in pf.built.info)S.ifinfo[k]=Object.assign(S.ifinfo[k]||{},pf.built.info[k]);
  const cv=coverageOf(batchSamples);
  S.batches.unshift({id:batchId,file:pf.parsed.name,ts:Date.now(),who:S.role,rows:pf.parsed.rowCount,added:batchSamples.length,
    coverage:cv.cov,checksum:cv.checksum,src:'xlsx',intervalNote:cv.intervalNote,

}
// Commit the staged file, then STREAM every remaining file of the same layout
// through one at a time (reusing the confirmed mapping, freeing each before the
// next) so peak memory stays at one file — 30×40k no longer spikes to 2–3 GB.
async function commitStaged(){
  const st=S.staged;if(!st)return;
  const resolved=st.parsed.resolved,map=resolved.map,sig=st.sig;
  const existKeys=new Set(S.samples.map(x=>x.ifid+'@'+x.ts));
  const queue=(S.uploadQueue||[]).slice(1); // rest after the staged file
  const total=1+queue.length;let done=0,totalAdded=0;const deferred=[];
  const setProg=(msg)=>{const m=$('#main');if(m){const b=m.querySelector('.commitprog');if(b)b.textContent=msg;}};
  toast(`⏳ Committing ${total} file(s)…`);
  await new Promise(r=>setTimeout(r,20));
  totalAdded+=await commitOneFile(st.group[0],map,existKeys);done++;
  st.group[0].parsed.rows=null;st.group[0].built=null; // free
  for(const f of queue){
    setProg(`Committing file ${done+1} of ${total}…`);
    await new Promise(r=>setTimeout(r,0));
    let parsed;try{parsed=await ingestFile(f);}catch(e){toast('❌ '+esc(f.name));continue;}
    const s2=parsed.headers.map(h=>norm(h)).join('¦');
    if(s2===sig){parsed.resolved=resolved;const built=buildSamples(parsed.rows,resolved,parsed.name,'staged');
      totalAdded+=await commitOneFile({parsed,built},map,existKeys);done++;parsed.rows=null;}
    else deferred.push(f); // different layout → needs its own mapping
  }
  save('ifinfo');save('batches');
  logAudit('upload.commit',st.parsed.name,`${totalAdded} samples across ${done} file(s)`);
  S.analytics=null;
  toast(`✅ Committed ${done} file(s) — ${totalAdded.toLocaleString()} new samples`);
  S.uploadQueue=deferred;
  if(deferred.length)stageNext(); // prompt once for the next distinct layout
  else{S.staged=null;S.uploadQueue=null;go('uploads');}
}
function cancelStaged(){S.staged=null;S.uploadQueue=null;render();}
function buildGroupView(pf,resolved,extraCount){
  const built={samples:pf.built.samples,info:pf.built.info,issues:pf.built.issues,extremes:pf.built.extremes,scaleGuessNote:pf.built.scaleGuessNote};
  const parsed={name:pf.parsed.name,headers:pf.parsed.headers,resolved,rowCount:pf.parsed.rowCount};

async function stageNext(){
  const q=S.uploadQueue;
  if(!q||!q.length){S.staged=null;render();return;}
  const dz=$('#dz');if(dz&&q.length>1)dz.innerHTML=`<div style="font-size:34px;opacity:.6">⏳</div><h3 style="margin:8px 0">Reading first file…</h3>`;
  await new Promise(r=>setTimeout(r,0));

/* ============================ ANALYTICS ENGINE ============================= */
function classify(ifid,intf){
  const n=(intf||'').toLowerCase();
  if(/(^|[^a-z])(po|port-?channel|core|spine|leaf|uplink)/.test(n))return{cls:'Core',impact:'Critical'};
  if(/trad|market|exch|fix|feed/.test(n))return{cls:'Trading',impact:'Critical'};
  if(/inet|internet|isp|wan|transit|border|edge/.test(n))return{cls:'Internet',impact:'High'};
  if(/back|bkp|repl|dr/.test(n))return{cls:'Backup',impact:'Low'};
  if(/stor|san|nas|iscsi/.test(n))return{cls:'Storage',impact:'High'};
  if(/voice|voip|sip/.test(n))return{cls:'Voice',impact:'Medium'};
  if(/mgmt|mgt|oob|console/.test(n))return{cls:'Management',impact:'Low'};
  if(/cust|client|tenant/.test(n))return{cls:'Customer',impact:'High'};
  return{cls:'WAN',impact:'Medium'};
}
function siteOf(dev){const m=(dev||'').match(/^([A-Za-z]{2,6})[-_]/);return m?m[1].toUpperCase():'SITE-A';}
const th=cls=>Object.assign({},S.cfg.thresholds,S.cfg.classThresholds[cls]||{});
function stateOfT(util,t){if(util==null)return'nodata';if(util>=t.crit)return'critical';if(util>=t.high)return'high';if(util>=t.warn)return'warning';return'normal';}
function stateOf(util,cls){return stateOfT(util,th(cls));}
function isBH(ts){const d=new Date(ts),h=d.getHours(),bh=S.cfg.businessHours;return bh.days.includes(d.getDay())&&h>=bh.startHr&&h<bh.endHr;}

function computeAnalytics(){
  const groups={};
  for(const x of S.samples){(groups[x.ifid]=groups[x.ifid]||[]).push(x);}
  const ifs=[];
  for(const ifid in groups){
    let s=groups[ifid].filter(x=>!x.maint).sort((a,b)=>a.ts-b.ts);
    if(!s.length)continue;
    const dev=s[0].dev,intf=s[0].intf;
    let {cls,impact}=classify(ifid,intf);
    const ov=S.ifmeta[ifid]||{};               // user-set overrides beat every automatic guess
    if(ov.cls)cls=ov.cls; if(ov.impact)impact=ov.impact;
    const tags=ov.tags||[];
    const info=S.ifinfo[ifid]||{};
    const site=ov.site||info.site||siteOf(dev);
    const tRes=Object.assign({},S.cfg.thresholds,S.cfg.classThresholds[cls]||{},ov.th||{}); // per-link thresholds win
    const tOffRes=Object.assign({},tRes,S.cfg.thresholdsOff||{},ov.thOff||{});               // off-hours bands (fall back to business)
    const hasOffBands=!!(S.cfg.thresholdsOff||ov.thOff);
    const tForS=x=>(!hasOffBands||isBH(x.ts))?tRes:tOffRes;
    const spOv=ov.speed?parseSpeed(ov.speed):null;                                          // per-link speed override
    if(spOv)s=s.map(x=>{const u=(x.tx!=null||x.rx!=null)?Math.max(x.tx||0,x.rx||0)/spOv:x.util;
      const pk=(x.ptx!=null||x.prx!=null)?Math.max(x.ptx||0,x.prx||0)/spOv:x.pu;
      return {...x,speed:spOv,util:u,pu:pk!=null&&pk>1.2?null:pk,bad:(u!=null&&(u<0||u>1.2))?1:undefined};});
    const speed=spOv||s.map(x=>x.speed).filter(Boolean).pop()||null;
    const badCount=s.filter(x=>x.bad).length;
    s=s.filter(x=>!x.bad);
    if(!s.length)continue;
    const speedTx=s.map(x=>x.speedTx).filter(Boolean).pop()||speed;
    const speedRx=s.map(x=>x.speedRx).filter(Boolean).pop()||speed;
    const utils=s.map(x=>x.util).filter(v=>v!=null&&v>=0&&v<=3);
    const p95=percentile(utils,0.95),p99=percentile(utils,0.99),avg=mean(utils),mx=amax(utils,0);
    // peak-column analytics (microbursts the averages hide)
    const pus=s.map(x=>x.pu).filter(v=>v!=null&&v>=0&&v<=3);
    const pkP95=pus.length?percentile(pus,0.95):null,pkMax=pus.length?amax(pus):null;
    // distribution (time-in-state)
    const dist={normal:0,warning:0,high:0,critical:0};let distN=0;
    for(const x of s){if(x.util==null||x.util<0||x.util>3)continue;dist[stateOfT(x.util,tForS(x))]++;distN++;}
    for(const k in dist)dist[k]/=(distN||1);
    // business-hour breaches
    const t=tRes;const breachesBH=s.filter(x=>x.util>=t.crit&&isBH(x.ts)).length;
    const bhDays=new Set(s.filter(x=>x.util>=t.high&&isBH(x.ts)).map(x=>new Date(x.ts).toDateString())).size;
    // Configurable link-upgrade policy (util > X% [in business hours] on Y distinct days)
    const ur=Object.assign({},S.cfg.upgradeRule,ov.upgrade||{});
    const upgradeDays=new Set(s.filter(x=>x.util!=null&&x.util>=ur.utilPct/100&&(!ur.businessHoursOnly||isBH(x.ts))).map(x=>new Date(x.ts).toDateString())).size;

function redrawChart(cfg){const el=document.querySelector(`.chart[data-chart="${cfg.id}"] svg`);if(el)el.outerHTML=chartSVG(cfg,false);}
function chartAt(e){const el=e.target.closest&&e.target.closest('.chart[data-chart]');if(!el)return null;const cfg=CHARTS[el.dataset.chart];if(!cfg)return null;cfg.el=el;return cfg;}
function chartDataX(cfg,clientX){const svg=cfg.el.querySelector('svg');const r=svg.getBoundingClientRect();const px=(clientX-r.left)/(r.width/cfg.w);return {px,dataX:cfg.vx0+clamp((px-cfg.pad.l)/(cfg.w-cfg.pad.l-cfg.pad.r))* (cfg.vx1-cfg.vx0),rect:r};}
function chartZoom(cfg,anchorX,factor){
  const span=(cfg.vx1-cfg.vx0)*factor;
  const minSpan=Math.max(60000,(cfg.fx1-cfg.fx0)/400),maxSpan=cfg.fx1-cfg.fx0;
  const ns=clamp(span,minSpan,maxSpan);
  const frac=(anchorX-cfg.vx0)/(cfg.vx1-cfg.vx0||1);
  cfg.vx0=clamp(anchorX-frac*ns,cfg.fx0,cfg.fx1-ns);
  cfg.vx1=cfg.vx0+ns;
  redrawChart(cfg);
}
function chartHover(cfg,e){
  const tip=cfg.el.querySelector('.tip'),hg=cfg.el.querySelector('.hg');
  const {px,dataX,rect}=chartDataX(cfg,e.clientX);
  if(px<cfg.pad.l-4||px>cfg.w-cfg.pad.r+4){tip.style.display='none';if(hg)hg.innerHTML='';return;}
  const speed=cfg.opts.speed;let rows='',marks='',t=null;
  for(const s of cfg.series){
    let best=null,bd=Infinity; // single pass, no per-move array allocation
    for(const p of s.data){if(p[1]==null||p[0]<cfg.vx0||p[0]>cfg.vx1)continue;const dd=Math.abs(p[0]-dataX);if(dd<bd){bd=dd;best=p;}}
    if(!best)continue;
    if(t==null||Math.abs(best[0]-dataX)<Math.abs(t-dataX))t=best[0];
    rows+=`<div class="trow"><i style="background:${s.color}"></i>${esc(s.name||'value')}<b>${pct1(best[1])}${speed?` · ${fmtBps(best[1]*speed)}`:''}</b></div>`;
    marks+=`<circle cx="${cfg.X(best[0]).toFixed(1)}" cy="${cfg.Y(best[1]).toFixed(1)}" r="3.4" fill="${s.color}" stroke="var(--bg2)" stroke-width="1.4"/>`;
  }
  if(t==null){tip.style.display='none';if(hg)hg.innerHTML='';return;}
  if(hg)hg.innerHTML=`<line class="crosshair" x1="${cfg.X(t).toFixed(1)}" x2="${cfg.X(t).toFixed(1)}" y1="${cfg.pad.t}" y2="${cfg.h-cfg.pad.b}"/>`+marks;

}

function donut(dist){
  const segs=[['normal',dist.normal],['warning',dist.warning],['high',dist.high],['critical',dist.critical]];
  const R=52,C=2*Math.PI*R;let off=0,arcs='';
  segs.forEach(([k,v])=>{const len=v*C;arcs+=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${stateColor(k)}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;});
  return `<svg class="donut" viewBox="0 0 140 140" width="140" height="140">${arcs}<text class="dt" x="70" y="66" text-anchor="middle" font-size="15" font-weight="700">${(dist.normal*100).toFixed(0)}%</text><text class="ax" x="70" y="82" text-anchor="middle" font-size="9">NORMAL</text></svg>`;
}
function heatmap(heat,t,tOffP,speed){
  const bhc=S.cfg.businessHours;
  const hasOff=!!(tOffP&&(tOffP.warn!==t.warn||tOffP.high!==t.high||tOffP.crit!==t.crit));
  const tOff=tOffP||t;
  const p2=h=>String(h).padStart(2,'0');
  // ---- horizontal timeline header: hour ticks every 3h + business-window strip ----
  let tl='<div class="dl" style="font-size:8px">hour</div>';
  for(let h=0;h<24;h++){const isB=h>=bhc.startHr&&h<bhc.endHr;
    tl+=`<div class="tlh" style="${isB?'color:var(--accent);font-weight:700':''}">${h%3===0?p2(h):''}</div>`;}
  let strip='<div></div>';
  for(let h=0;h<24;h++){const isB=h>=bhc.startHr&&h<bhc.endHr;
    strip+=`<div style="height:5px;border-radius:2px;background:${isB?'var(--accent)':'rgba(120,150,200,.20)'};opacity:${isB?.8:1}" title="${p2(h)}:00–${p2(h+1)}:00 ${isB?'business':'off-hours'}"></div>`;}
  // ---- cells: banded against business OR off-hours limits, click → details ----
  let cells='';
  for(let d=0;d<7;d++){cells+=`<div class="dl">${DOW[d]}</div>`;
    for(let h=0;h<24;h++){const v=heat[d+'-'+h];
      const isB=bhc.days.includes(d)&&h>=bhc.startHr&&h<bhc.endHr;
      const tb=isB?t:tOff;
      const st=v==null?'nodata':stateOfT(v,tb);const c=v==null?'rgba(120,150,200,.06)':stateColor(st);
      const info=v==null?'':`${DOW[d]} ${p2(h)}:00–${p2((h+1)%24)}:00 · ${isB?'business hours':'off-hours'} · avg utilization ${pct1(v)}${speed?` (~${fmtBps(v*speed)})`:''} · ${st} band — ${isB?'business':'off-hours'} limits ${Math.round(tb.warn*100)}/${Math.round(tb.high*100)}/${Math.round(tb.crit*100)}%`;
      cells+=`<div class="cell" ${v!=null?`data-info="${esc(info)}"`:''} title="${v==null?`${DOW[d]} ${p2(h)}:00 — no data`:esc(info)}" style="background:${c};opacity:${v==null?1:0.35+clamp(v,0,1)*0.65}${isB?';box-shadow:inset 0 0 0 1px rgba(56,189,248,.45)':''};cursor:${v!=null?'pointer':'default'}"></div>`;}}
  return `<div class="heatwrap"><div class="heat">${tl}${strip}${cells}</div>
  <div class="heattip mini" style="display:none;margin-top:7px;padding:7px 10px;border:1px solid var(--stroke2);border-radius:8px;background:var(--panel2);color:var(--txt)"></div>
  <div class="mini" style="margin-top:6px"><i style="display:inline-block;width:9px;height:9px;border:1px solid rgba(56,189,248,.7);border-radius:2px;vertical-align:-1px"></i> outlined = business hours ${bhc.startHr}:00–${bhc.endHr}:00 (limits ${Math.round(t.warn*100)}/${Math.round(t.high*100)}/${Math.round(t.crit*100)}%)${hasOff?` · off-hours limits ${Math.round(tOff.warn*100)}/${Math.round(tOff.high*100)}/${Math.round(tOff.crit*100)}%`:''} · click a cell for exact numbers</div></div>`;
}

function bhStats(r){
  const t=r.th||th(r.cls);
  const mk=(list,tb)=>{const u=list.map(x=>x.util).filter(v=>v!=null);
    const dist={normal:0,warning:0,high:0,critical:0};for(const v of u)dist[stateOfT(v,tb)]++;
    const n=u.length||1;for(const k in dist)dist[k]/=n;
    return {n:u.length,avg:mean(u),p95:percentile(u,0.95),max:amax(u,0),dist};};
  const bh=[],off=[];
  for(const x of r.samples)(isBH(x.ts)?bh:off).push(x);
  return {bh:mk(bh,t),off:mk(off,r.thOff||t)}; // off-hours judged against its own limits
}

function bhInsight(b,r){
  if(!b.bh.n||!b.off.n)return 'Not enough data yet to compare business and off-hours behavior.';
  const ratio=b.bh.p95/Math.max(b.off.p95,0.005);
  const parts=[];
  if(ratio>=1.3)parts.push(`This link is clearly business-driven — busy-period load is ${ratio.toFixed(1)}× higher during business hours (${pct1(b.bh.p95)} vs ${pct1(b.off.p95)} off-hours).`);
  else if(ratio<=0.75)parts.push(`Off-hours traffic runs hotter than business hours (${pct1(b.off.p95)} vs ${pct1(b.bh.p95)}) — typical of backup/replication jobs; verify that is expected on a ${r.cls} link.`);
  else parts.push(`Load is fairly even around the clock (${pct1(b.bh.p95)} business vs ${pct1(b.off.p95)} off-hours).`);
  if(b.bh.dist.critical>0.02)parts.push(`It is critical ${pct1(b.bh.dist.critical)} of business time — users feel this directly.`);
  else if(b.off.dist.critical>0.02)parts.push(`Critical periods happen almost only off-hours (${pct1(b.off.dist.critical)} of off-hours time), so user impact is limited.`);
  if(r.bhDays)parts.push(`High/critical levels were hit on ${r.bhDays} business day(s) in this window.`);
  return parts.join(' ');
}

function distExplain(r){
  const warm=r.dist.warning+r.dist.high;const parts=[];
  if(r.dist.critical>0.02)parts.push(`This link was critically busy ${pct1(r.dist.critical)} of the time (plus ${pct1(r.dist.high)} in the high band).`);
  else if(warm>0.15)parts.push(`This link runs warm ${pct1(warm)} of the time but is rarely critical.`);
  else parts.push(`This link is healthy — in the normal band ${pct1(r.dist.normal)} of the time.`);
  parts.push(`It is busiest ${peakWindow(r)}.`);
  if(r.forecast.growthMoM>0.05)parts.push(`Load is growing ~${(r.forecast.growthMoM*100).toFixed(0)}% per month — watch the forecast below.`);
  return parts.join(' ');
}
function peakWindow(r){let best=null,bv=-1;for(const k in r.heat){if(r.heat[k]>bv){bv=r.heat[k];best=k;}}if(!best)return'across the week';const[d,h]=best.split('-');return `around ${h}:00 on ${DOW[+d]}`;}
function buildTimeline(r){
  const ev=[];
  ev.push({ts:r.start,k:'',txt:'📈 Monitoring began — first sample ingested'});

  const t=r.th||th(r.cls);const firstBreach=r.samples.find(x=>x.util>=t.crit);
  if(firstBreach)ev.push({ts:firstBreach.ts,k:'critical',txt:`🔴 First Critical breach (${pct1(firstBreach.util)})`});
  for(const m of S.maintenance.filter(m=>m.target===r.ifid||m.target===r.dev||m.scope==='all'))ev.push({ts:m.start,k:'maint',txt:`⚙ Maintenance: ${esc(m.reason||'window')}`});
  for(const c of (S.comments[r.ifid]||[]))ev.push({ts:c.ts,k:'',txt:`💬 ${esc(c.who)}: ${esc(c.txt)}`});

function upgradeHits(r,winStart,winEnd){
  const ur=r.upgradeRule;const thr=ur.utilPct/100;
  let hits=0,last=null,peak=0;const days=new Set();
  for(const x of r.samples){
    if(x.ts<winStart||x.ts>winEnd)continue;
    if(x.util==null||x.util<thr)continue;
    if(ur.businessHoursOnly&&!isBH(x.ts))continue;
    hits++;days.add(new Date(x.ts).toDateString());last=x.ts;if(x.util>peak)peak=x.util;
  }
  return {hits,days:days.size,last,peak,thr:ur.utilPct,bhOnly:ur.businessHoursOnly,reqDays:ur.days,met:days.size>=ur.days};
}

/* ---- Minimal XLSX writer: real .xlsx via stored (uncompressed) ZIP entries.
   No libraries — CRC32 + OOXML worksheet XML with inline strings. ---- */
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){ // [{name,text}] → Blob (ZIP, method 0)
  const enc=new TextEncoder();const parts=[];const central=[];let off=0;
  const d=new Date();const dosTime=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  const dosDate=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const f of files){
    const name=enc.encode(f.name),data=enc.encode(f.text),crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);
    lh.setUint16(10,dosTime,true);lh.setUint16(12,dosDate,true);lh.setUint32(14,crc,true);
    lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,name.length,true);
    parts.push(lh.buffer,name,data);
    central.push({name,crc,size:data.length,off});
    off+=30+name.length+data.length;
  }
  const cdParts=[];let cdSize=0;
  for(const c of central){
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);
    ch.setUint16(12,dosTime,true);ch.setUint16(14,dosDate,true);ch.setUint32(16,c.crc,true);
    ch.setUint32(20,c.size,true);ch.setUint32(24,c.size,true);ch.setUint16(28,c.name.length,true);
    ch.setUint32(42,c.off,true);
    cdParts.push(ch.buffer,c.name);cdSize+=46+c.name.length;
  }

const xmlEsc=v=>String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function colL(i){let t='';i++;while(i>0){t=String.fromCharCode(64+((i-1)%26+1))+t;i=Math.floor((i-1)/26);}return t;}
function sheetXML(rows){
  let out='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  rows.forEach((row,ri)=>{out+=`<row r="${ri+1}">`;
    row.forEach((v,ci)=>{if(v==null||v==='')return;const ref=colL(ci)+(ri+1);
      if(typeof v==='number'&&isFinite(v))out+=`<c r="${ref}"><v>${v}</v></c>`;
      else out+=`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;});
    out+='</row>';});
  return out+'</sheetData></worksheet>';
}
function xlsxBlob(sheets){ // [{name,rows:[[...]]}] → .xlsx Blob

    {name:'_rels/.rels',text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml',text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map((sh,i)=>`<sheet name="${xmlEsc(sh.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+'</sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels',text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')+'</Relationships>'}
  ];

function genUpgradePolicyXlsx(scope){
  if(!S.samples.length){toast('No data yet');return;}
  const a=A();const list=scope==='all'?a.ifs:a.ifs.filter(r=>r.ifid===scope);
  if(!list.length){toast('Link not found');return;}
  const p2=n=>String(n).padStart(2,'0');
  const fmtTs=ts=>{const d=new Date(ts);return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`;};
  const summary=[
    ['NetPulse — Link Upgrade Policy Report'],
    [`Generated: ${new Date().toLocaleString()}`,'',`Scope: ${scope==='all'?'all links':list[0].dev+' '+list[0].intf}`],
    [],
    ['Device','Interface','Link name','Site','Class','Impact','Capacity (Mbps)','Policy threshold %','Policy days','Business hours only','Days threshold hit','Total hits','Upgrade trigger met','Busy p95 %','Verdict']];
  const hits=[['Device','Interface','Site','Timestamp','Utilization %','Transmit (Mbps)','Received (Mbps)','Capacity (Mbps)','Business hours','Policy threshold %']];
  const MAXH=50000;let truncated=false,totalHits=0;
  for(const r of list){

    const rhits=r.samples.filter(x=>x.util!=null&&x.util>=thr&&(!ur.businessHoursOnly||isBH(x.ts)));
    totalHits+=rhits.length;
    summary.push([r.dev,r.intf,r.linkname||'',r.site,r.cls,r.impact,r.speed?+(r.speed/1e6).toFixed(0):'',ur.utilPct,ur.days,ur.businessHoursOnly?'Yes':'No',r.upgradeDays,rhits.length,r.upgradeNeeded?'YES':'no',+(r.p95*100).toFixed(1),r.verdict.title]);
    for(const x of rhits){
      if(hits.length>MAXH){truncated=true;break;}
      hits.push([r.dev,r.intf,r.site,fmtTs(x.ts),+((x.util*100).toFixed(2)),x.tx!=null?+((x.tx/1e6).toFixed(1)):'',x.rx!=null?+((x.rx/1e6).toFixed(1)):'',r.speed?+((r.speed/1e6).toFixed(0)):'',isBH(x.ts)?'Yes':'No',ur.utilPct]);
    }
    if(truncated)break;
  }
  if(truncated)hits.push(['NOTE: hit list truncated at 50,000 rows — narrow the scope (single link or shorter window) for full detail']);
  const blob=xlsxBlob([{name:'Summary',rows:summary},{name:'Policy Hits',rows:hits}]);
  const fname=`NetPulse_Upgrade_Policy_${scope==='all'?'AllLinks':(list[0].dev+'_'+list[0].intf).replace(/\W+/g,'_')}_${new Date().toISOString().slice(0,10)}.xlsx`;
  dl(blob,fname);
  logAudit('report.export.xlsx',scope==='all'?'all links':scope,`${totalHits} policy hit rows`);
  toast(`📊 Excel report downloaded — ${totalHits.toLocaleString()} policy hit(s)`);
}
