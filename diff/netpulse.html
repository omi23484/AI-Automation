function genReport(kind,id){
  const a=A();let title='',body='';
  const tbl=(rows,cols)=>`<table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  if(kind==='exec'){title='Executive Summary';const crit=a.ifs.filter(r=>r.verdict.level==='critical');const b90=a.ifs.filter(r=>r.forecast.t90>0&&r.forecast.t90<=90);
    body=`<div class="ai"><div class="h">◆ Narrative</div><p>Infrastructure risk stands at <b>${a.infraRisk}/100</b> across ${a.sites.length} site(s) and ${a.ifs.length} interfaces. ${crit.length} link(s) are critical; ${b90.length} are forecast to breach 90% utilization within 90 days. Recommended focus: the highest-risk business-critical links listed below.</p></div>
    <h3 style="margin:16px 0 8px">Top exposures</h3>${tbl([...a.ifs].sort((x,y)=>y.risk.score-x.risk.score).slice(0,10),[['Interface',r=>`${esc(r.dev)} ${esc(r.intf)}`],['Class',r=>r.cls],['Impact',r=>r.impact],['Risk',r=>r.risk.score],['Verdict',r=>r.verdict.title]])}`;}
  else if(kind==='capacity'){title='Weekly Capacity Report';const list=a.ifs.filter(r=>r.forecast.t90>0).sort((x,y)=>x.forecast.t90-y.forecast.t90).slice(0,15);
    body=tbl(list,[['Interface',r=>`${esc(r.dev)} ${esc(r.intf)}`],['Class',r=>r.cls],['p95',r=>pct1(r.p95)+(r.speed?' ('+fmtBps(r.p95*r.speed)+')':'')],['MoM',r=>(r.forecast.growthMoM*100).toFixed(0)+'%'],['Time→90%',r=>Math.round(r.forecast.t90)+'d'],['Upgrade window',r=>r.forecast.window?r.forecast.window.join('–')+'d':'—'],['Conf',r=>(r.forecast.conf*100).toFixed(0)+'%']]);}
  else if(kind==='trend'){title='Monthly Trend Report';const g=[...a.ifs].sort((x,y)=>y.forecast.growthMoM-x.forecast.growthMoM).slice(0,15);
    body=tbl(g,[['Interface',r=>`${esc(r.dev)} ${esc(r.intf)}`],['Class',r=>r.cls],['MoM growth',r=>(r.forecast.growthMoM>0?'+':'')+(r.forecast.growthMoM*100).toFixed(0)+'%'],['p95',r=>pct1(r.p95)]]);}
  else if(kind==='busy'){title='Top Busy Links';const g=[...a.ifs].sort((x,y)=>y.p95-x.p95).slice(0,15);body=tbl(g,[['Interface',r=>`${esc(r.dev)} ${esc(r.intf)}`],['Class',r=>r.cls],['p95 util',r=>pct1(r.p95)],['p95 bandwidth',r=>r.speed?fmtBps(r.p95*r.speed):'–'],['Peak',r=>pct1(r.mx)]]);}
  else if(kind==='critical'){title='Top Critical Links';const g=[...a.ifs].filter(r=>r.verdict.level==='critical').sort((x,y)=>y.risk.score-x.risk.score);body=tbl(g,[['Interface',r=>`${esc(r.dev)} ${esc(r.intf)}`],['Impact',r=>r.impact],['Risk',r=>r.risk.score],['Verdict',r=>r.verdict.title]])||'<p>No critical links.</p>';}
  else if(kind==='idle'){title='Idle Links';const g=[...a.ifs].filter(r=>r.p95<0.05).sort((x,y)=>x.p95-y.p95);body=tbl(g,[['Interface',r=>`${esc(r.dev)} ${esc(r.intf)}`],['Class',r=>r.cls],['p95',r=>pct1(r.p95)]])||'<p>No idle links.</p>';}
  else if(kind==='impact'){title='Business Impact Report';const ir={Critical:0,High:1,Medium:2,Low:3};const g=[...a.ifs].filter(r=>r.verdict.level!=='normal').sort((x,y)=>ir[x.impact]-ir[y.impact]||y.risk.score-x.risk.score);body=tbl(g.slice(0,20),[['Interface',r=>`${esc(r.dev)} ${esc(r.intf)}`],['Impact',r=>r.impact],['Verdict',r=>r.verdict.title],['Risk',r=>r.risk.score]]);}
  else if(kind==='intf'){const r=a.ifs.find(x=>x.ifid===id);title='Interface Report — '+r.dev+' '+r.intf;body=`<div class="ai"><div class="h">◆ Summary</div><p>${r.ai}</p></div>`;}
  logAudit('report.generate',title);
  const html=`<div class="panel pad" id="rpt"><div class="flex"><h2>${title}</h2><span class="spacer"></span><span class="small">${new Date().toLocaleString()}</span><button class="btn sm ghost" onclick="exportReport('${esc(title)}')">⤓ Export HTML</button><button class="btn sm ghost" onclick="window.print()">🖨 PDF</button></div><div class="small" style="margin:6px 0 14px">NetPulse · generated report · excludes maintenance windows</div>${body}</div>`;
  const out=$('#reportOut');
  if(out){out.innerHTML=html;out.scrollIntoView({behavior:'smooth'});}
  else{go('reports');setTimeout(()=>{$('#reportOut').innerHTML=html;},50);}
}
function exportReport(title){const el=$('#rpt');if(!el)return;const blob=new Blob([`<!doctype html><meta charset=utf8><title>${title}</title><body style="background:#0a0e17;color:#e6edf7;font-family:sans-serif;padding:30px">${el.innerHTML}</body>`],{type:'text/html'});dl(blob,title.replace(/\W+/g,'_')+'.html');logAudit('report.export',title);}
function dl(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
function exportAll(){dl(new Blob([JSON.stringify({batches:S.batches,samples:S.samples,cfg:S.cfg,audit:S.audit},null,0)],{type:'application/json'}),'netpulse_export.json');logAudit('data.export','all');}

function askRCA(id){const a=A();const r=a.ifs.find(x=>x.ifid===id);const f=r.forecast;const firstBreach=r.samples.find(x=>x.util>=th(r.cls).crit);
  const rel=a.byDev[r.dev].filter(x=>x.ifid!==id).sort((x,y)=>y.risk.score-x.risk.score).slice(0,3);
  const msg=`
  <div class="ai" style="text-align:left"><div class="h">🔍 RCA — ${esc(r.dev)} ${esc(r.intf)}</div>
  <p><b>When did it start?</b> ${firstBreach?fmtDate(firstBreach.ts):'No hard breach; elevated trend'}<br>
  <b>Recurring?</b> ${r.bhDays>=3?`Yes — high/critical on ${r.bhDays} business days`:'Not strongly recurring'}<br>
  <b>Business hours?</b> ${r.breachesBH>0?`Yes — ${r.breachesBH} business-hour breaches`:'Mostly off-hours'}<br>
  <b>Growth trend?</b> ${(f.growthMoM*100).toFixed(0)}% MoM, ${f.slopePerDay>0?'rising':'flat/declining'}<br>
  <b>Related interfaces?</b> ${rel.map(x=>esc(x.intf)).join(', ')||'none correlated'}<br>
  <b>Maintenance correlation?</b> ${S.maintenance.some(m=>m.target===r.ifid||m.target===r.dev)?'Overlaps a maintenance window':'None'}<br>
  <b>Likely cause?</b> ${rcaCause(r)}<br>
  <b>Recommended next steps?</b> ${r.verdict.action}</p></div>`;
  toast('RCA generated — see interface');logAudit('rca.generate',r.ifid);
  const banner=$('.verdict');if(banner)banner.insertAdjacentHTML('afterend',`<div style="margin-bottom:16px">${msg}</div>`);
}
function rcaCause(r){const f=r.forecast;if(f.growthMoM>0.1&&r.bhDays>=3)return'Organic business-hour demand growth';if(r.anomalies.some(a=>a.type.includes('Weekend')))return'Newly scheduled off-hours job (backup/replication) or misclassification';if(r.anomalies.some(a=>a.type.includes('imbalance')))return'Asymmetric routing / unidirectional flow';if(r.mx>0.9)return'Localized burst / elephant flow';return'Elevated utilization consistent with steady load';}

/* ------------------------------ interactions ------------------------------ */
function saveIfMeta(ifid){
  const m={cls:$('#metaCls').value,impact:$('#metaImp').value};
  const tags=$('#metaTags').value.split(',').map(t=>t.trim()).filter(Boolean);if(tags.length)m.tags=tags;
  const sp=($('#metaSpeed')||{}).value?.trim();if(sp)m.speed=sp;
  const si=($('#metaSite')||{}).value?.trim();if(si)m.site=si;
  const thv={};[['warn','#metaWarn'],['high','#metaHigh'],['crit','#metaCrit']].forEach(([b,sel])=>{const el=$(sel);if(el){const n=parseFloat(el.value);if(!isNaN(n))thv[b]=clamp(n/100,0,2);}});
  if(Object.keys(thv).length)m.th=thv;
  S.ifmeta[ifid]=m;save('ifmeta');
  logAudit('interface.meta',ifid,JSON.stringify(m));
  S.analytics=null;render();toast('Link settings saved — analytics recomputed');
}
function resetIfMeta(ifid){delete S.ifmeta[ifid];save('ifmeta');logAudit('interface.meta.reset',ifid);S.analytics=null;render();toast('Reverted to automatic classification');}
function addComment(id){const v=$('#cmt').value.trim();if(!v)return;(S.comments[id]=S.comments[id]||[]).push({ts:Date.now(),who:S.role,txt:v});save('comments');logAudit('comment.add',id,v);render();}
function addMaint(){const scope=$('#mScope').value;const s=$('#mStart').value,e=$('#mEnd').value;if(!s||!e)return toast('Set start and end');
  let sc='all',target='';if(scope.startsWith('dev:')){sc='dev';target=scope.slice(4);}else if(scope.startsWith('if:')){sc='if';target=scope.slice(3);}
  S.maintenance.push({scope:sc,target,start:new Date(s).getTime(),end:new Date(e).getTime(),reason:$('#mReason').value,who:S.role});save('maintenance');logAudit('maintenance.create',target||'all');S.analytics=null;render();toast('Maintenance window added');}
function delMaint(i){S.maintenance.splice(i,1);save('maintenance');logAudit('maintenance.delete','');S.analytics=null;render();}
function saveThresholds(){S.cfg.thresholds={warn:+$('#thWarn').value/100,high:+$('#thHigh').value/100,crit:+$('#thCrit').value/100};save('cfg');logAudit('config.thresholds','',JSON.stringify(S.cfg.thresholds));S.analytics=null;toast('Thresholds saved — verdicts recomputed');render();}
function savePlanning(){S.cfg.businessHours.startHr=+$('#bhStart').value;S.cfg.businessHours.endHr=+$('#bhEnd').value;S.cfg.planHorizonDays=+$('#planH').value;S.cfg.upgradeLeadDays=+$('#leadD').value;save('cfg');logAudit('config.planning');S.analytics=null;toast('Saved');render();}
function remap(field,idx){S.staged.parsed.resolved.map[field]=idx===''?null:+idx;S.staged.parsed.resolved.conf[field]=1;reStage();}
function reStage(){const st=S.staged;st.built=buildSamples(st.parsed.rows,st.parsed.resolved,st.parsed.name,'staged');st.findings=validateStaged(st.parsed,st.built);render();}
function removeBatch(id){
  const b=S.batches.find(x=>x.id===id);if(!b)return;
  if(!confirm(`Delete batch “${b.file}” and its ${b.added} samples? Use this to undo an upload committed with a wrong mapping.`))return;
  S.samples=S.samples.filter(x=>x.batch!==id);
  S.batches=S.batches.filter(x=>x.id!==id);
  save('samples');save('batches');logAudit('upload.remove',b.file,`${b.added} samples deleted`);
  S.analytics=null;render();toast('Batch removed — analytics recomputed');
}
function resetAll(){if(!confirm('Delete all uploaded data, batches, config and audit? This cannot be undone.'))return;S.samples=[];S.batches=[];S.maintenance=[];S.comments={};S.analytics=null;save('samples');save('batches');save('maintenance');save('comments');logAudit('data.reset','all');toast('All data cleared');go('uploads');}

async function handleFiles(files){
  for(const f of files){
    try{const parsed=await ingestFile(f);const built=buildSamples(parsed.rows,parsed.resolved,parsed.name,'staged');const findings=validateStaged(parsed,built);S.staged={parsed,built,findings};render();}
    catch(e){toast('❌ '+esc(f.name)+': '+esc(e.message));console.error(e);}
    break; // one at a time through the validation console
  }
}

/* --------------------------------- demo ----------------------------------- */
function genDemo(){
  const sites=['LON','NYC'];const devs=['Core-01','Core-02','Edge-01','Leaf-11','Leaf-12','Agg-01'];
  const intfs=[['Ethernet1/1','Core'],['Ethernet1/2','Trading'],['Ethernet1/3','Internet'],['Po10','Core'],['Ethernet2/1','Backup'],['Ethernet2/2','Storage'],['Ethernet2/3','Customer'],['mgmt0','Management']];
  const speeds={Core:1e11,Trading:1e10,Internet:1e10,Backup:1e10,Storage:4e10,Customer:1e10,Management:1e9};
  const now=Date.now();const start=now-14*86400000;const rows=[];
  let seed=42;const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  for(let si=0;si<sites.length;si++)for(let di=0;di<3;di++){const dev=sites[si]+'-'+devs[di+si*3%devs.length];
    for(const [intf,cls] of intfs){const speed=speeds[cls];const base=({Trading:.35,Core:.4,Internet:.5,Backup:.15,Storage:.3,Customer:.45,Management:.05})[cls]||.3;
      const growth=(cls==='Trading'||cls==='Internet'||cls==='Customer')?(0.35+rnd()*0.5):(rnd()*0.12);
      for(let t=start;t<now;t+=3600000){const d=new Date(t);const hr=d.getHours(),dow=d.getDay();const prog=(t-start)/(now-start);
        let u=base*(1+growth*prog);
        if(dow>=1&&dow<=5&&hr>=9&&hr<17)u*=1.35+ (cls==='Trading'?0.35:0);
        else u*=0.5;
        if((dow===0||dow===6)&&cls==='Backup')u=0.8+rnd()*0.15;
        if((dow===0)&&cls==='Core'&&rnd()>0.75)u+=0.28; // injected weekend anomaly
        u=Math.max(0.01,u+ (rnd()-0.5)*0.10);
        const util=Math.min(u,0.99);const bps=util*speed;const rx=bps*(0.55+rnd()*0.45);
        const pkT=Math.min(bps*(1.15+rnd()*0.6),speed*0.995),pkR=Math.min(rx*(1.15+rnd()*0.6),speed*0.995);
        rows.push([dev,intf,new Date(t).toISOString().slice(0,19).replace('T',' '),
          (bps/1e9).toFixed(3),(rx/1e9).toFixed(3),(pkT/1e9).toFixed(3),(pkR/1e9).toFixed(3),(speed/1e9)+'G',(speed/1e9)+'G']);
      }}}
  const headers=['Device','Port','Poll Timestamp','Average Transmit (Gbps)','Average Receive (Gbps)','Peak Transmit (Gbps)','Peak Receive (Gbps)','Transmit Bandwidth','Received Bandwidth'];
  const resolved=resolveColumns(headers,rows);
  const built=buildSamples(rows,resolved,'demo_polling_14d.xlsx','staged');
  const batchId='b'+Date.now();built.samples.forEach(x=>x.batch=batchId);
  S.samples=S.samples.concat(built.samples);
  S.batches.unshift({id:batchId,file:'demo_polling_14d.xlsx',ts:Date.now(),who:S.role,rows:rows.length,added:built.samples.length,coverage:[start,now],checksum:'demo',src:'demo',intervalNote:'~60 min',entities:new Set(built.samples.map(x=>x.ifid)).size,map:resolved.map,headers});
  save('samples');save('batches');logAudit('demo.generate','',built.samples.length+' samples');
  S.analytics=null;toast('✨ Demo data generated — '+built.samples.length.toLocaleString()+' samples');go('exec');
}

/* ------------------------------- router ----------------------------------- */
const VIEWS={exec:view_exec,noc:view_noc,twin:view_twin,intf:view_intf,links:view_links,site:view_twin_site_redirect,capacity:view_capacity,trends:view_trends,anomalies:view_anomalies,historical:view_historical,uploads:view_uploads,maintenance:view_maintenance,reports:view_reports,audit:view_audit,admin:view_admin};
function view_twin_site_redirect(){S.scope.twinSite=S.scope.id;S.view='twin';return view_twin();}
function go(view,scope){S.view=view;if(scope)S.scope=scope;render();}
function navTo(obj){if(obj.twin){S.scope.twinSite=obj.twin.site;S.scope.twinDev=obj.twin.dev||null;S.view='twin';}else{S.view=obj.view;if(obj.id!=null)S.scope.id=obj.id;if(obj.view==='twin'){S.scope.twinSite=null;S.scope.twinDev=null;}}render();}
const reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function staggerReveal(){
  if(reduceMotion)return;
  const cards=$$('#main .panel, #main > .grid > .kpi, #main .verdict, #main .tile');
  cards.forEach((c,i)=>{c.classList.add('reveal');c.style.animationDelay=Math.min(i*45,520)+'ms';});
}
function animateCounters(){
  if(reduceMotion)return;
  $$('#main .kpi .v').forEach(el=>{
    const m=el.textContent.trim().match(/^(\d+)(%?)$/);if(!m)return;
    const target=+m[1],sfx=m[2],dur=760,t0=performance.now();el.textContent='0'+sfx;
    (function tick(t){const p=clamp((t-t0)/dur);el.textContent=Math.round(target*(1-Math.pow(1-p,3)))+sfx;if(p<1)requestAnimationFrame(tick);})(t0);
  });
}
function render(){
  renderNav();
  for(const k in CHARTS)delete CHARTS[k];
  const main=$('#main');const fn=VIEWS[S.view]||view_exec;
  try{main.innerHTML=fn();}catch(e){main.innerHTML=`<div class="empty"><div class="big">⚠</div><h2>Render error</h2><p class="small">${esc(e.message)}</p></div>`;console.error(e);}
  main.classList.remove('swap');void main.offsetWidth;main.classList.add('swap');
  staggerReveal();animateCounters();
  wireDynamic();
}
function wireDynamic(){
  const dz=$('#dz');
  if(dz){const inp=$('#fileInput');window.fileInput=inp;
    inp.onchange=e=>handleFiles(e.target.files);
    ['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag');}));
    ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag');}));
    dz.addEventListener('drop',e=>handleFiles(e.dataTransfer.files));
  }
}

/* ------------------------------- events ----------------------------------- */
document.addEventListener('click',e=>{
  const cz=e.target.closest('[data-cz]');
  if(cz){const cfg=chartAt(e);if(cfg){const mid=(cfg.vx0+cfg.vx1)/2;
    if(cz.dataset.cz==='in')chartZoom(cfg,mid,0.6);
    else if(cz.dataset.cz==='out')chartZoom(cfg,mid,1.7);
    else{cfg.vx0=cfg.fx0;cfg.vx1=cfg.fx1;redrawChart(cfg);}}return;}
  const nav=e.target.closest('[data-view]');if(nav){go(nav.dataset.view);return;}
  const n=e.target.closest('[data-nav]');if(n){navTo(JSON.parse(n.dataset.nav));return;}
  const tw=e.target.closest('[data-twin]');if(tw){navTo({twin:JSON.parse(tw.dataset.twin)});return;}
});
$('#roleSel').onchange=e=>{S.role=e.target.value;logAudit('role.switch',e.target.value);toast('Viewing as '+e.target.value);};
$('#demoBtn').onclick=genDemo;
$('#wallBtn').onclick=()=>{document.documentElement.requestFullscreen?.();};
function applyTheme(t){document.documentElement.classList.toggle('light',t==='light');try{localStorage.setItem('np-theme',t)}catch(e){}}
$('#themeBtn').onclick=()=>{applyTheme(document.documentElement.classList.contains('light')?'dark':'light');render();};
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')handleQuery(e.target.value);});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();$('#q').focus();}});
function handleQuery(q){
  if(!q.trim())return;if(!S.samples.length){toast('No data yet');return;}
  const a=A();const ql=q.toLowerCase();
  // entity match
  let hit=a.ifs.find(r=>ql.includes(r.intf.toLowerCase())&&ql.includes(r.dev.toLowerCase()))||a.ifs.find(r=>ql.includes(r.dev.toLowerCase()))||a.ifs.find(r=>ql.includes(r.intf.toLowerCase()));
  if(hit){navTo({view:'intf',id:hit.ifid});toast('Grounded answer: '+hit.verdict.title+' — '+pct1(hit.p95)+' p95');return;}
  if(/critical|worst|risk/.test(ql)){const r=[...a.ifs].sort((x,y)=>y.risk.score-x.risk.score)[0];navTo({view:'intf',id:r.ifid});toast('Highest-risk link: '+r.dev+' '+r.intf);return;}
  if(/capacity|forecast|upgrade|saturat/.test(ql)){go('capacity');return;}
  if(/anomal/.test(ql)){go('anomalies');return;}
  toast('No entity matched. Try “Core-01 Ethernet1/2” or “worst link”.');
}
